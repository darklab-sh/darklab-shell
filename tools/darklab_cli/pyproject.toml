[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darklab-cli"
version = "0.2.0"
description = "Headless CLI client for darklab_shell API v1"
requires-python = ">=3.11"

[project.scripts]
darklab = "darklab_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
