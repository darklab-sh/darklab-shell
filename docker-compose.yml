services:
  redis:
    image: redis:8-alpine
    container_name: darklab-redis
    restart: unless-stopped
    # Redis is coordination/cache state for this stack, not durable app data.
    # Disable persistence so Redis 8 does not try to write RDB/AOF files under
    # the read-only root filesystem and enter MISCONF.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --stop-writes-on-bgsave-error
      - "no"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    container_name: darklab-postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-darklab_shell}
      POSTGRES_USER: ${POSTGRES_USER:-darklab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darklab_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darklab} -d ${POSTGRES_DB:-darklab_shell}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: darklab-llama
    restart: unless-stopped
    profiles:
      - llama
    volumes:
      - llama-cache:/root/.cache
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -hf
      - ${LLAMA_HF_MODEL:-bartowski/Meta-Llama-3.1-8B-Instruct-GGUF:Q4_K_M}
      - --alias
      - ${AI_MODEL:-Llama-3.1-8B-Instruct}
      - -t
      - "${LLAMA_THREADS:-8}"
      - -c
      - "${LLAMA_CTX_SIZE:-2048}"
      - -n
      - "${LLAMA_N_PREDICT:-180}"
      - -np
      - "${LLAMA_PARALLEL:-1}"
      - --cont-batching
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  shell:
    build:
      context: .
      args:
        APP_PORT: ${APP_PORT:-8888}
        APP_VERSION: ${APP_VERSION:-2.6.0-rc.7}
        VCS_REF: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: darklab_shell
    labels:
      sh.darklab.config.database_backend: ${DATABASE_BACKEND:-sqlite}
      sh.darklab.metrics.path: /metrics
    init: true
    ports:
      - "${APP_PORT:-8888}:${APP_PORT:-8888}"
    volumes:
      - ./app:/app:ro
      - ./data:/data
    tmpfs:
      - /tmp
    cap_add:
      - NET_RAW
      - NET_ADMIN
    read_only: true
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_PORT=${APP_PORT:-8888}
      - PROMETHEUS_MULTIPROC_DIR=${PROMETHEUS_MULTIPROC_DIR:-/tmp/darklab_shell-prom}
      - DATABASE_BACKEND=${DATABASE_BACKEND:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_POOL_MIN=${DATABASE_POOL_MIN:-1}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-5}
      - DATABASE_POSTGRES_JIT=${DATABASE_POSTGRES_JIT:-false}
      - AI_WORKER_ENABLED=${AI_WORKER_ENABLED:-0}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_PROVIDER=${AI_PROVIDER:-openai_compatible}
      - AI_BASE_URL=${AI_BASE_URL:-http://llama:8080}
      - AI_MODEL=${AI_MODEL:-Llama-3.1-8B-Instruct}
      - AI_API_KEY_SECRET_NAME=${AI_API_KEY_SECRET_NAME:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_CONNECT_TIMEOUT_SECONDS=${AI_CONNECT_TIMEOUT_SECONDS:-5}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-120}
      - AI_MAX_INPUT_CHARS=${AI_MAX_INPUT_CHARS:-24000}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-120}
      - AI_NEXT_COMMANDS_MAX_OUTPUT_TOKENS=${AI_NEXT_COMMANDS_MAX_OUTPUT_TOKENS:-180}
      - AI_MAX_CONCURRENT=${AI_MAX_CONCURRENT:-1}
      - AI_MAX_QUEUE_DEPTH=${AI_MAX_QUEUE_DEPTH:-20}
      - AI_RATE_LIMIT_PER_SESSION_HOUR=${AI_RATE_LIMIT_PER_SESSION_HOUR:-5}
      - AI_RATE_LIMIT_GLOBAL_PER_MINUTE=${AI_RATE_LIMIT_GLOBAL_PER_MINUTE:-2}
      - AI_ALLOW_FULL_OUTPUT=${AI_ALLOW_FULL_OUTPUT:-false}
      - AI_REQUIRE_PRIVATE_BASE_URL=${AI_REQUIRE_PRIVATE_BASE_URL:-true}
      - AI_BASE_URL_ALLOWED_CIDRS=${AI_BASE_URL_ALLOWED_CIDRS:-}
      - AI_PROMPT_VERSION_OVERRIDE=${AI_PROMPT_VERSION_OVERRIDE:-}
      - AI_FEATURE_SUMMARY=${AI_FEATURE_SUMMARY:-false}
      - AI_FEATURE_NEXT_COMMANDS=${AI_FEATURE_NEXT_COMMANDS:-false}
      - AI_FEATURE_RUN_SUGGESTIONS=${AI_FEATURE_RUN_SUGGESTIONS:-false}
      # The entrypoint uses this path to normalize workspace permissions before
      # dropping privileges. The app also treats WORKSPACE_ROOT as the runtime
      # workspace_root override, so Compose deployments only need this setting.
      - WORKSPACE_ROOT=${WORKSPACE_ROOT:-/tmp/darklab_shell-workspaces}
      # Comma-separated CIDRs that command validation rejects and the scanner
      # user cannot reach at the container OUTPUT layer.
      - RESTRICTED_COMMAND_INPUT_CIDRS=${RESTRICTED_COMMAND_INPUT_CIDRS:-}
      # Opt-in only. Runtime readiness still requires the container capability
      # bounding set and scanner binary file capabilities to be intact.
      - RAW_PACKET_SCANNING_ENABLED=${RAW_PACKET_SCANNING_ENABLED:-false}
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${APP_PORT:-8888}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      llama:
        condition: service_healthy
        required: false

volumes:
  postgres-data:
  llama-cache:
