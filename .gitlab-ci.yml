        - name: Release evidence index
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/darklab-shell-deploy/${RELEASE_VERSION}/release-evidence.json
        - name: Container image platform index
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/darklab-shell-deploy/${RELEASE_VERSION}/release-index.json
        - name: Release build input inventory
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/darklab-shell-deploy/${RELEASE_VERSION}/release-build-inputs.json
        - name: Linux AMD64 vulnerability report
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/darklab-shell-deploy/${RELEASE_VERSION}/vulnerability-report-amd64.json

release-public-smoke:
  stage: post-release
  image: $CI_DOCKER_IMAGE
  extends: .protected-release-tag
  needs:
    - job: release-image-gitlab-index
      artifacts: true
    - job: release-image-dockerhub
      artifacts: true
    - job: release-payload-upload
    - job: release-create
      optional: true
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache cosign curl jq python3
  script:
    - |
      release_check_failed() {
        actual=$(printf '%s' "$4" | tr '\r\n\t' '   ')
        printf 'release verification failed stage=%s check=%s expected=%s actual=%.160s\n' \
          "$1" "$2" "$3" "$actual" >&2
        exit 1
      }
      require_equal() {
        [ "$4" = "$3" ] || release_check_failed "$1" "$2" "$3" "$4"
      }
      require_contains() {
        case "$4" in
          *"$3"*) ;;
          *) release_check_failed "$1" "$2" "$3" "$4" ;;
        esac
      }
      index_digest_from_inspect() {
        sed -n 's/^Digest:[[:space:]]*//p' "$1" | head -n 1
      }
      docker logout "$CI_REGISTRY" >/dev/null 2>&1 || true
      docker logout docker.io >/dev/null 2>&1 || true
      docker buildx imagetools inspect "$GITLAB_INDEX_IMAGE" > anonymous-gitlab-image.txt
      anonymous_gitlab_digest=$(index_digest_from_inspect anonymous-gitlab-image.txt)
      require_equal public_gitlab_image digest "$GITLAB_INDEX_DIGEST" "$anonymous_gitlab_digest"
      docker buildx imagetools inspect "$DOCKERHUB_INDEX_IMAGE" > anonymous-dockerhub-image.txt
      anonymous_dockerhub_digest=$(index_digest_from_inspect anonymous-dockerhub-image.txt)
      require_equal public_dockerhub_image digest "$DOCKERHUB_INDEX_DIGEST" "$anonymous_dockerhub_digest"
      docker buildx imagetools inspect --raw "$GITLAB_INDEX_IMAGE" > anonymous-gitlab-index.json
      docker buildx imagetools inspect --raw "$DOCKERHUB_INDEX_IMAGE" > anonymous-dockerhub-index.json
      require_equal public_registry_index content \
        "$(sha256sum anonymous-gitlab-index.json | cut -d' ' -f1)" \
        "$(sha256sum anonymous-dockerhub-index.json | cut -d' ' -f1)"
      expected_platforms=1
      [ "$RELEASE_PLATFORM_MODE" = dual ] && expected_platforms=2
      require_equal public_registry_index platform_count "$expected_platforms" \
        "$(jq '[.manifests[] | select(.platform.os == "linux")] | length' anonymous-gitlab-index.json)"
      curl -fsS \
        "https://hub.docker.com/v2/namespaces/darklabsh/repositories/darklab-shell" \
        > dockerhub-repository.json
      dockerhub_overview=$(jq -r '.full_description // empty' dockerhub-repository.json)
      require_contains dockerhub_overview oidc_issuer \
        'https://gitlab.com' "$dockerhub_overview"
      require_contains dockerhub_overview signing_identity_regexp \
        '^https://gitlab\.com/darklab\.sh/darklab_shell//\.gitlab-ci\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
        "$dockerhub_overview"
    - docker pull "$DOCKERHUB_INDEX_IMAGE"
    - CONTAINER_MOUNT_MODE=volume sh scripts/release/verify_repository_free_image.sh "$DOCKERHUB_INDEX_IMAGE" "$RELEASE_VERSION" "$CI_COMMIT_SHA" "$PYTHON_BASE_AMD64_DIGEST" amd64
    - |
      release_check_failed() {
        actual=$(printf '%s' "$4" | tr '\r\n\t' '   ')
        printf 'release verification failed stage=%s check=%s expected=%s actual=%.160s\n' \
          "$1" "$2" "$3" "$actual" >&2
        exit 1
      }
      require_equal() {
        [ "$4" = "$3" ] || release_check_failed "$1" "$2" "$3" "$4"
      }
      require_nonempty() {
        [ -n "$3" ] || release_check_failed "$1" "$2" nonempty empty
      }
      release_compose() {
        docker compose \
          --project-name "$smoke_project" \
          --env-file "$CI_PROJECT_DIR/release-install/.env" \
          -f "$CI_PROJECT_DIR/release-install/compose.yaml" \
          -f "$smoke_override" \
          "$@"
      }
      release_shell_container() {
        release_compose ps -q shell
      }
      wait_for_release_health() {
        attempt=0
        until docker exec "$smoke_probe" \
          curl -fsS "http://127.0.0.1:${smoke_port}/health" >/dev/null 2>&1; do
          if [ "$attempt" -ge 90 ]; then
            release_check_failed public_compose_runtime health ready timeout
          fi
          shell_container=$(release_shell_container)
          if [ -n "$shell_container" ] \
            && [ "$(docker inspect --format '{{.State.Running}}' "$shell_container")" != "true" ]; then
            release_check_failed public_compose_runtime shell_state running stopped
          fi
          attempt=$((attempt + 1))
          sleep 2
        done
        shell_container=$(release_shell_container)
        require_nonempty public_compose_runtime shell_container "$shell_container"
        attempt=0
        while [ "$(docker inspect --format '{{.State.Health.Status}}' "$shell_container")" != "healthy" ]; do
          if [ "$attempt" -ge 45 ]; then
            release_check_failed public_compose_runtime compose_health healthy timeout
          fi
          attempt=$((attempt + 1))
          sleep 2
        done
      }
      package_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/darklab-shell-deploy/${RELEASE_VERSION}"
      curl -fsSLO "${package_url}/setup.sh"
      curl -fsSLO "${package_url}/setup.sh.sha256"
      curl -fsSLO "${package_url}/SHA256SUMS"
      curl -fsSLO "${package_url}/SHA256SUMS.sigstore.json"
      for evidence_file in \
        darklab-shell-amd64.cdx.json provenance.intoto.jsonl release-build-inputs.json \
        release-evidence.json release-index.json vulnerability-report-amd64.json; do
        curl -fsSLO "${package_url}/${evidence_file}"
        grep "  ${evidence_file}$" SHA256SUMS | sha256sum -c -
      done
      if [ "$RELEASE_PLATFORM_MODE" = dual ]; then
        for evidence_file in darklab-shell-arm64.cdx.json vulnerability-report-arm64.json; do
          curl -fsSLO "${package_url}/${evidence_file}"
          grep "  ${evidence_file}$" SHA256SUMS | sha256sum -c -
        done
      fi
      signing_identity="${CI_PROJECT_URL}//.gitlab-ci.yml@refs/tags/${CI_COMMIT_TAG}"
      cosign verify-blob SHA256SUMS \
        --bundle SHA256SUMS.sigstore.json \
        --certificate-identity "$signing_identity" \
        --certificate-oidc-issuer "$CI_SERVER_URL"
      cosign verify \
        --certificate-identity "$signing_identity" \
        --certificate-oidc-issuer "$CI_SERVER_URL" \
        "$GITLAB_INDEX_IMAGE@$GITLAB_INDEX_DIGEST"
      cosign verify \
        --certificate-identity "$signing_identity" \
        --certificate-oidc-issuer "$CI_SERVER_URL" \
        "$DOCKERHUB_INDEX_IMAGE@$DOCKERHUB_INDEX_DIGEST"
      for child_digest in "$GITLAB_AMD64_DIGEST" "$GITLAB_ARM64_DIGEST"; do
        [ -n "$child_digest" ] || continue
        cosign verify \
          --certificate-identity "$signing_identity" \
          --certificate-oidc-issuer "$CI_SERVER_URL" \
          "$GITLAB_INDEX_IMAGE@$child_digest"
        cosign verify \
          --certificate-identity "$signing_identity" \
          --certificate-oidc-issuer "$CI_SERVER_URL" \
          "$DOCKERHUB_INDEX_IMAGE@$child_digest"
      done
      sha256sum -c setup.sh.sha256
      sh setup.sh --dir "$CI_PROJECT_DIR/release-install"
      "$CI_PROJECT_DIR/release-install/darklab-deploy" status
      docker compose \
        --env-file "$CI_PROJECT_DIR/release-install/.env" \
        -f "$CI_PROJECT_DIR/release-install/compose.yaml" \
        config --quiet
      smoke_project="darklab-release-${CI_JOB_ID}"
      smoke_probe="darklab-release-probe-${CI_JOB_ID}"
      smoke_config_volume="darklab-release-conf-${CI_JOB_ID}"
      smoke_override="$CI_PROJECT_DIR/release-compose-smoke.override.yaml"
      smoke_port=$((20000 + CI_JOB_ID % 10000))
      printf '\nAPP_PORT=%s\nWEB_CONCURRENCY=1\nWEB_THREADS=2\nNOTIFICATION_WORKER_ENABLED=0\nSCHEDULER_ENABLED=0\n' \
        "$smoke_port" >> "$CI_PROJECT_DIR/release-install/.env"
      printf '\napp_name: release-compose\n' \
        >> "$CI_PROJECT_DIR/release-install/conf/config.local.yaml"
      docker volume create "$smoke_config_volume" >/dev/null
      tar -C "$CI_PROJECT_DIR/release-install/conf" -cf - . \
        | docker run --rm -i --entrypoint sh \
            -v "$smoke_config_volume:/config" \
            "$DOCKERHUB_INDEX_IMAGE" -c 'tar -xf - -C /config'
      cat > "$smoke_override" <<EOF
      services:
        shell:
          volumes:
            - type: volume
              source: release-smoke-config
              target: /config
              read_only: true
      volumes:
        release-smoke-config:
          external: true
          name: $smoke_config_volume
      EOF
      release_compose pull shell redis
      "$CI_PROJECT_DIR/release-install/verify-release-image.sh"
      release_compose up -d --pull never
      docker run -d \
        --name "$smoke_probe" \
        --network host \
        --entrypoint sh \
        "$DOCKERHUB_INDEX_IMAGE" \
        -c 'sleep 300' >/dev/null
      wait_for_release_health
      shell_container=$(release_shell_container)
      require_nonempty public_compose_runtime shell_container "$shell_container"
      running_image_id=$(docker inspect --format '{{.Image}}' "$shell_container")
      expected_image_id=$(docker image inspect --format '{{.Id}}' "$DOCKERHUB_INDEX_IMAGE")
      require_equal public_compose_runtime image_id "$expected_image_id" "$running_image_id"
      if ! docker image inspect "$DOCKERHUB_INDEX_IMAGE" \
        | jq -e --arg digest "$DOCKERHUB_INDEX_DIGEST" \
          '.[0].RepoDigests | any(endswith("@" + $digest))' >/dev/null; then
        release_check_failed public_compose_runtime repo_digest "$DOCKERHUB_INDEX_DIGEST" missing
      fi
      if ! docker inspect "$shell_container" \
        | jq -e '.[0].Mounts | all(.Destination != "/app")' >/dev/null; then
        release_check_failed public_compose_runtime app_source_mount absent present
      fi
      if ! docker exec "$smoke_probe" \
        curl -fsS "http://127.0.0.1:${smoke_port}/config" \
        | jq -e '.app_name == "release-compose"' >/dev/null; then
        release_check_failed public_compose_runtime app_name release-compose mismatch
      fi
      docker exec "$shell_container" sh -c \
        'printf "%s\n" release-compose-restart > /data/release-compose-restart-marker'
      release_compose restart shell
      wait_for_release_health
      shell_container=$(release_shell_container)
      docker exec "$shell_container" test -f /data/release-compose-restart-marker \
        || release_check_failed public_compose_runtime durable_data_marker present missing
  after_script:
    - |
      docker rm -f "darklab-release-probe-${CI_JOB_ID}" >/dev/null 2>&1 || true
      if [ -f "$CI_PROJECT_DIR/release-install/compose.yaml" ]; then
        cleanup_compose() {
          if [ -f "$CI_PROJECT_DIR/release-compose-smoke.override.yaml" ]; then
            docker compose \
              --project-name "darklab-release-${CI_JOB_ID}" \
              --env-file "$CI_PROJECT_DIR/release-install/.env" \
              -f "$CI_PROJECT_DIR/release-install/compose.yaml" \
              -f "$CI_PROJECT_DIR/release-compose-smoke.override.yaml" \
              "$@"
          else
            docker compose \
              --project-name "darklab-release-${CI_JOB_ID}" \
              --env-file "$CI_PROJECT_DIR/release-install/.env" \
              -f "$CI_PROJECT_DIR/release-install/compose.yaml" \
              "$@"
          fi
        }
        cleanup_compose logs --no-color > release-compose.log 2>&1 || true
        cleanup_compose down -v --remove-orphans || true
      fi
      docker volume rm "darklab-release-conf-${CI_JOB_ID}" >/dev/null 2>&1 || true
  artifacts:
    when: always
    paths:
      - anonymous-gitlab-image.txt
      - anonymous-dockerhub-image.txt
      - dockerhub-repository.json
      - release-install/release-manifest.json
      - release-compose.log
    expire_in: 1 week
