release-supply-chain:
  stage: attest
  image: $CI_DOCKER_IMAGE
  extends: .protected-release-tag
  needs:
    - job: release-image-gitlab-index
      artifacts: true
    - job: release-image-amd64-vulnerability-scan
      artifacts: true
    - job: release-image-arm64-vulnerability-scan
      optional: true
      artifacts: true
    - job: release-image-dockerhub
      artifacts: true
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_YES: "true"
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache cosign jq python3
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
    - >-
      python3 scripts/release/build_release_evidence.py
      --version "$RELEASE_VERSION"
      --gitlab-image "$GITLAB_INDEX_IMAGE"
      --dockerhub-image "$DOCKERHUB_INDEX_IMAGE"
      --release-index release-index.json
      --dockerhub-index-digest "$DOCKERHUB_INDEX_DIGEST"
      --commit-sha "$CI_COMMIT_SHA"
      --commit-tag "$CI_COMMIT_TAG"
      --pipeline-url "$CI_PIPELINE_URL"
      --pipeline-created-at "$CI_PIPELINE_CREATED_AT"
      --build-date "$RELEASE_BUILD_DATE"
      --sbom-amd64 release-evidence-amd64/darklab-shell-amd64.cdx.json
      --sbom-arm64 release-evidence-arm64/darklab-shell-arm64.cdx.json
      --vulnerability-report-amd64 release-evidence-amd64/vulnerability-report-amd64.json
      --vulnerability-report-arm64 release-evidence-arm64/vulnerability-report-arm64.json
      --syft-version "$SYFT_VERSION"
      --grype-version "$GRYPE_VERSION"
      --gitlab-cli-image "$CI_GITLAB_CLI_IMAGE"
      --output-dir release-evidence
    - |
      signing_identity="${CI_PROJECT_URL}//.gitlab-ci.yml@refs/tags/${CI_COMMIT_TAG}"
      verify_release_signature() {
        cosign verify \
          --certificate-identity "$signing_identity" \
          --certificate-oidc-issuer "$CI_SERVER_URL" \
          "$1"
      }
      verify_release_signature_with_retry() {
        signature_target="$1"
        signature_verify_attempt=1
        signature_verify_delay=2
        signature_verify_max_attempts=7
        while :; do
          if signature_verify_output=$(verify_release_signature "$signature_target" 2>&1); then
            printf '%s\n' "$signature_verify_output"
            return 0
          fi
          if [ "$signature_verify_attempt" -ge "$signature_verify_max_attempts" ]; then
            printf '%s\n' "$signature_verify_output" >&2
            printf 'Signature for %s was not visible after %s verification attempts.\n' \
              "$signature_target" "$signature_verify_attempt" >&2
            return 1
          fi
          printf 'Signature for %s is not visible yet; retrying in %s seconds (%s/%s).\n' \
            "$signature_target" "$signature_verify_delay" \
            "$signature_verify_attempt" "$signature_verify_max_attempts"
          sleep "$signature_verify_delay"
          signature_verify_attempt=$((signature_verify_attempt + 1))
          if [ "$signature_verify_delay" -lt 32 ]; then
            signature_verify_delay=$((signature_verify_delay * 2))
          fi
        done
      }
      targets="${GITLAB_INDEX_IMAGE}@${GITLAB_INDEX_DIGEST} ${DOCKERHUB_INDEX_IMAGE}@${DOCKERHUB_INDEX_DIGEST}"
      for digest in "$GITLAB_AMD64_DIGEST" "$GITLAB_ARM64_DIGEST"; do
        [ -n "$digest" ] || continue
        targets="$targets ${GITLAB_INDEX_IMAGE}@${digest} ${DOCKERHUB_INDEX_IMAGE}@${digest}"
      done
      for target in $targets; do
        if signature_verify_output=$(verify_release_signature "$target" 2>&1); then
          printf 'Reusing existing verified signature for %s.\n' "$target"
          printf '%s\n' "$signature_verify_output"
          continue
        fi
        cosign sign "$target"
        verify_release_signature_with_retry "$target"
      done
  artifacts:
    when: always
    paths:
      - release-evidence/
    expire_in: 1 week

release-payload-upload:
  stage: release
  image: $CI_DOCKER_IMAGE
  extends: .protected-release-tag
  needs:
    - job: release-image-gitlab-index
