      "$GITLAB_INDEX_IMAGE@$GITLAB_INDEX_DIGEST" "$RELEASE_VERSION" "$CI_COMMIT_SHA"
      "$PYTHON_BASE_AMD64_DIGEST" amd64
    - sh scripts/release/verify_bundled_tools.sh "$GITLAB_INDEX_IMAGE@$GITLAB_INDEX_DIGEST" amd64

release-image-rehearsal-arm64-index-smoke:
