        - name: SHA256SUMS Sigstore bundle
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/darklab-shell-deploy/${RELEASE_VERSION}/SHA256SUMS.sigstore.json
        - name: Deployment archive
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/darklab-shell-deploy/${RELEASE_VERSION}/darklab-shell-deploy-${RELEASE_VERSION}.tar.gz
        - name: Deployment archive checksum
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/darklab-shell-deploy/${RELEASE_VERSION}/darklab-shell-deploy-${RELEASE_VERSION}.tar.gz.sha256
        - name: Linux AMD64 CycloneDX SBOM
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/darklab-shell-deploy/${RELEASE_VERSION}/darklab-shell-amd64.cdx.json
        - name: SLSA provenance
