default:
  tags:
    - self-hosted

variables:
  CI_DEFAULT_IMAGE: "python:3.14.7-slim"
  CI_PYTHON_E2E_IMAGE: "python:3.14.7"
  CI_NODE_IMAGE: "node:26.7.0-slim"
  CI_DOCKER_IMAGE: "docker:29.7.2"
  CI_GITLAB_CLI_IMAGE: "registry.gitlab.com/gitlab-org/cli:v1.114.0@sha256:797256f9f46c6da08a337566eb11b3e53dee31fdef7d2d41b379d5841ed10cd7"
  DOCKERHUB_IMAGE: "docker.io/darklabsh/darklab-shell"
  SYFT_VERSION: "1.42.3"
  SYFT_IMAGE: "anchore/syft:v1.42.3@sha256:5999d209a342e55e9edf70bf8930fb5b86d8f2a783fa401178372c50e21b1d36"
  GRYPE_VERSION: "0.112.0"
  GRYPE_IMAGE: "anchore/grype:v0.112.0@sha256:391bfda62888fb4e98ff5c4c81598f7431a3c1eac3f8519d69d1ff00df247c1d"
  RELEASE_PLATFORM_MODE: "dual"
  RELEASE_DEGRADED_REASON: ""
  RELEASE_SELINUX_COMPATIBILITY_ENABLED: "0"
  RELEASE_ROOTLESS_PODMAN_COMPATIBILITY_ENABLED: "0"
  RELEASE_STAGING_CLEANUP_ENABLED: "0"
  RELEASE_STAGING_CLEANUP_DRY_RUN: "0"
  RELEASE_STAGING_KEEP_DAYS: "14"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

image: $CI_DEFAULT_IMAGE

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

stages:
  - test
  - lint
  - audit
  - cache
  - build
  - publish
  - verify
  - promote
  - attest
  - release
  - post-release

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/

before_script:
  - pip install -q -r app/requirements.txt -r requirements-dev.txt

.playwright-lane:
  stage: test
  image: $CI_PYTHON_E2E_IMAGE
  variables:
    PLAYWRIGHT_PROJECT_COUNT: "3"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - curl -fsSL https://deb.nodesource.com/setup_26.x | bash - && apt-get install -y -q nodejs iputils-ping
    - pip install -q -r app/requirements.txt -r requirements-dev.txt
    - npm ci
    - npx playwright install --with-deps chromium
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week

test-js-e2e:
  extends: .playwright-lane
  script:
    - npm run test:e2e

test-js-e2e-source:
  extends: .playwright-lane
  script:
    - npm run test:e2e:source

.pytest-lane:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update -q && apt-get install -y -q curl git jq
    - pip install -q -r app/requirements.txt -r requirements-dev.txt

test-py-pytest-fast:
  extends: .pytest-lane
  script:
    - mkdir -p test-results
    - python scripts/test-support/check_pytest_partitions.py
    - >-
      bash -o pipefail -c
      'bash scripts/run_pytest.sh -c .tooling/pytest.ini --rootdir=.
      -m "not release_integration" tests/py
      --junitxml=test-results/pytest-fast.xml --durations=50 -v
      | tee test-results/pytest-fast-durations.txt'
  after_script:
    - python scripts/test-support/summarize_pytest_junit.py test-results/pytest-fast.xml test-results/pytest-fast-files.txt --lane fast
  artifacts:
    when: always
    paths:
      - test-results/pytest-fast.xml
      - test-results/pytest-fast-durations.txt
      - test-results/pytest-fast-files.txt
    reports:
      junit: test-results/pytest-fast.xml
    expire_in: 1 week

test-py-pytest-release:
  extends: .pytest-lane
  script:
    - mkdir -p test-results
    - >-
      bash -o pipefail -c
      'bash scripts/run_pytest.sh -c .tooling/pytest.ini --rootdir=.
      -m release_integration tests/py
      --junitxml=test-results/pytest-release.xml --durations=50 -v
      | tee test-results/pytest-release-durations.txt'
  after_script:
    - python scripts/test-support/summarize_pytest_junit.py test-results/pytest-release.xml test-results/pytest-release-files.txt --lane release_integration
  artifacts:
    when: always
    paths:
      - test-results/pytest-release.xml
      - test-results/pytest-release-durations.txt
      - test-results/pytest-release-files.txt
    reports:
      junit: test-results/pytest-release.xml
    expire_in: 1 week

test-js-unit:
  stage: test
  image: $CI_NODE_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - npm ci
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
  script:
    - npm run test:unit

test-py-postgres:
  stage: test
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    POSTGRES_DB: darklab_shell
    POSTGRES_USER: darklab
    POSTGRES_PASSWORD: darklab_dev_password
    DARKLAB_TEST_POSTGRES_DSN: "postgresql://darklab:darklab_dev_password@postgres:5432/darklab_shell"
    PYTEST_JUNIT_XML: "test-results/pytest-postgres.xml"
    PYTEST_DURATIONS: "50"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update -q && apt-get install -y -q git
    - pip install -q -r app/requirements.txt -r requirements-dev.txt
  script:
    - mkdir -p test-results
    - bash -o pipefail -c 'bash scripts/run_postgres_tests.sh | tee test-results/pytest-postgres-durations.txt'
  after_script:
    - python scripts/test-support/summarize_pytest_junit.py test-results/pytest-postgres.xml test-results/pytest-postgres-files.txt --lane postgres
  artifacts:
    when: always
    paths:
      - test-results/pytest-postgres.xml
      - test-results/pytest-postgres-durations.txt
      - test-results/pytest-postgres-files.txt
    reports:
      junit: test-results/pytest-postgres.xml
    expire_in: 1 week

lint-py:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update -q && apt-get install -y -q git
    - pip install -q -r app/requirements.txt -r requirements-dev.txt
  script:
    - >
      ruff check --config .tooling/ruff.toml app/ tests/py/ scripts/*.py
      scripts/development/*.py scripts/generate/*.py scripts/operations/
      scripts/release/*.py scripts/release/check_versions.sh
      scripts/test-support/*.py
    - bandit -r app/ -ll -q
    - python scripts/release/check_source_licenses.py
    - yamllint -c .tooling/yamllint.yml $(find . \( -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*' -not -path './node_modules/*')

lint-js:
  stage: lint
  image: $CI_NODE_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update -q && apt-get install -y -q shellcheck curl
    - curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint && chmod +x /usr/local/bin/hadolint
    - npm ci
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
  script:
    - npm run lint:js
    - npm run lint:css
    - npm run lint:shell
    - npm run lint:docker
    - npm run lint:md
    - npm run lint:json
    - npm run vendor:check
    - npm run assets:check

audit-py:
  stage: audit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - pip install -q pip-audit
    - pip-audit -r app/requirements.txt

audit-js:
  stage: audit
  image: $CI_NODE_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - npm ci
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
  script:
    - npm run audit:js

container-license-audit:
  stage: audit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script: []
  script:
    - python scripts/release/check_container_licenses.py

release-version-audit:
  stage: audit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script: []
  script:
    - python scripts/release/check_versions.sh --check-release-version

dependency-version-check:
  stage: audit
  before_script:
    - apt-get update -q
    - apt-get install -y -q nodejs npm
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - when: manual
      allow_failure: true
  script:
    - ./scripts/release/check_versions.sh | tee version-check.txt
  artifacts:
    when: always
    paths:
      - version-check.txt
    expire_in: 1 week

container-smoke-test:
  stage: build
  image: $CI_DOCKER_IMAGE
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache python3 py3-pip py3-pytest docker-cli-compose
    - python3 -m pip install --break-system-packages --root-user-action=ignore --quiet -r app/requirements.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - when: manual
      allow_failure: true
  script:
    - mkdir -p test-results
    - sh -o pipefail -c './scripts/container_smoke_test.sh | tee test-results/container-smoke-durations.txt'
  after_script:
    - python3 scripts/test-support/summarize_pytest_junit.py test-results/container_smoke_test.xml test-results/container-smoke-files.txt --lane container_smoke
  artifacts:
    when: always
    paths:
      - test-results/container_smoke_test.xml
      - test-results/container-smoke-durations.txt
      - test-results/container-smoke-files.txt
    reports:
      junit: test-results/container_smoke_test.xml
    expire_in: 1 week

docker-build:
  stage: build
  image: $CI_DOCKER_IMAGE
  interruptible: true
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - apk add --no-cache jq
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"'
      when: never
    # Tags skip this branch-only image; protected release tags build the canonical image below.
    - if: $CI_COMMIT_TAG
      when: never
    # Always build on the main branch so there is always a verified image
    - if: $CI_COMMIT_BRANCH == "main"
    # Always build for merge requests targeting main so the merge gate sees a build
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    # On other branches, only build when image-affecting files change
    - changes:
        - Dockerfile
        - app/**/*
        - .dockerignore
        - scripts/container/**/*
        - docker-compose*.yml
        - compose*.yaml
        - deploy/compose*.yaml
    # Allow a manual trigger on any branch for one-off verification
    - when: manual
      allow_failure: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - |
      # Build through the same inputs as docker-build-cache-amd64 and the fan-out jobs so
      # this branch image shares one cache chain with them. Resolving the amd64 child
      # manifest matters: the bare tag resolves to the index digest instead, which is a
      # different base reference and misses every warmed layer from the first RUN onward.
      python_base_image=$(sed -n 's/^ARG PYTHON_BASE_IMAGE=//p' Dockerfile)
      docker buildx imagetools inspect --raw "$python_base_image" > python-base-index.json
      python_base_digest=$(jq -r '
        [.manifests[]
          | select(.platform.os == "linux" and .platform.architecture == "amd64")
          | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
        ][0].digest // empty
      ' python-base-index.json)
      printf '%s' "$python_base_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
      apt_cache_epoch=$(sh scripts/container/resolve_apt_cache_epoch.sh \
        "$CI_PIPELINE_CREATED_AT")
      build_context=$(mktemp)
      trap 'rm -f "$build_context"' EXIT
      scripts/container/create_portable_build_context.sh "$build_context"
      docker buildx build --platform linux/amd64 --provenance=false \
        --progress=plain \
        --build-arg "PYTHON_BASE_IMAGE=${python_base_image}@${python_base_digest}" \
        --build-arg "PYTHON_BASE_DIGEST=${python_base_digest}" \
        --build-arg "APT_CACHE_EPOCH=${apt_cache_epoch}" \
        --cache-from "type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache-amd64" \
        --load --tag "darklab_shell:$CI_COMMIT_SHA" - < "$build_context"
    - docker pull "$SYFT_IMAGE"
    - docker pull "$GRYPE_IMAGE"
    - mkdir -p branch-image-evidence
    - >-
      docker run --rm
      --user 0:0
      -v /var/run/docker.sock:/var/run/docker.sock
      "$SYFT_IMAGE"
      "docker:darklab_shell:$CI_COMMIT_SHA"
      -o cyclonedx-json
      > branch-image-evidence/darklab-shell.cdx.json
    - >-
      cat branch-image-evidence/darklab-shell.cdx.json |
      docker run --rm -i
      "$GRYPE_IMAGE"
      --only-fixed --fail-on critical -o json
      > branch-image-evidence/vulnerability-report.json
  artifacts:
    when: always
    paths:
      - branch-image-evidence/darklab-shell.cdx.json
      - branch-image-evidence/vulnerability-report.json
    expire_in: 1 week

docker-build-cache-amd64:
  stage: cache
  image: $CI_DOCKER_IMAGE
  interruptible: true
  tags:
    - self-hosted
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  resource_group: release-cache-amd64
  before_script:
    - apk add --no-cache jq
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"
    - when: never
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - |
      python_base_image=$(sed -n 's/^ARG PYTHON_BASE_IMAGE=//p' Dockerfile)
      docker buildx imagetools inspect --raw "$python_base_image" > python-base-index.json
      python_base_digest=$(jq -r '
        [.manifests[]
          | select(.platform.os == "linux" and .platform.architecture == "amd64")
          | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
        ][0].digest // empty
      ' python-base-index.json)
      printf '%s' "$python_base_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
      apt_cache_epoch=$(sh scripts/container/resolve_apt_cache_epoch.sh \
        "$CI_PIPELINE_CREATED_AT")
      cache_image="${CI_REGISTRY_IMAGE}:buildcache-amd64"
      build_context=$(mktemp)
      trap 'rm -f "$build_context"' EXIT
      scripts/container/create_portable_build_context.sh "$build_context"
      docker buildx build --pull --platform linux/amd64 --provenance=false \
        --progress=plain \
        --build-arg "PYTHON_BASE_IMAGE=${python_base_image}@${python_base_digest}" \
        --build-arg "PYTHON_BASE_DIGEST=${python_base_digest}" \
        --build-arg "APT_CACHE_EPOCH=${apt_cache_epoch}" \
        --cache-from "type=registry,ref=${cache_image}" \
        --cache-to "type=registry,ref=${cache_image},mode=max" \
        --output type=cacheonly - < "$build_context"
      printf '%s\n' \
        "SCHEDULED_PYTHON_BASE_IMAGE=${python_base_image}" \
        "SCHEDULED_PYTHON_BASE_DIGEST=${python_base_digest}" \
        "SCHEDULED_APT_CACHE_EPOCH=${apt_cache_epoch}" \
        "SCHEDULED_AMD64_CACHE_REF=${cache_image}" \
        > scheduled-docker-cache.env
  artifacts:
    reports:
      dotenv: scheduled-docker-cache.env
    expire_in: 1 day

.scheduled-docker-build:
  stage: build
  image: $CI_DOCKER_IMAGE
  interruptible: true
  needs:
    - job: docker-build-cache-amd64
      artifacts: true
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_DOCKER_BUILD_FANOUT == "1"
    - when: never
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - |
      test -n "$SCHEDULED_PYTHON_BASE_IMAGE"
      printf '%s' "$SCHEDULED_PYTHON_BASE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
      apt_cache_epoch=$(sh scripts/container/resolve_apt_cache_epoch.sh \
        "$SCHEDULED_APT_CACHE_EPOCH")
      test "$apt_cache_epoch" = "$SCHEDULED_APT_CACHE_EPOCH"
      test "$SCHEDULED_AMD64_CACHE_REF" = "${CI_REGISTRY_IMAGE}:buildcache-amd64"
      build_context=$(mktemp)
      trap 'rm -f "$build_context"' EXIT
      scripts/container/create_portable_build_context.sh "$build_context"
      docker buildx build --pull --platform linux/amd64 --provenance=false \
        --progress=plain \
        --build-arg "PYTHON_BASE_IMAGE=${SCHEDULED_PYTHON_BASE_IMAGE}@${SCHEDULED_PYTHON_BASE_DIGEST}" \
        --build-arg "PYTHON_BASE_DIGEST=${SCHEDULED_PYTHON_BASE_DIGEST}" \
        --build-arg "APT_CACHE_EPOCH=${apt_cache_epoch}" \
        --cache-from "type=registry,ref=${SCHEDULED_AMD64_CACHE_REF}" \
        --load --tag "darklab_shell:${CI_COMMIT_SHA}" - < "$build_context"

docker-build-bael:
  extends: .scheduled-docker-build
  tags:
    - bael

docker-build-bune:
  extends: .scheduled-docker-build
  tags:
    - bune

docker-build-botis:
  extends: .scheduled-docker-build
  tags:
    - botis

docker-build-babi:
  extends: .scheduled-docker-build
  tags:
    - babi

docker-build-bile:
  extends: .scheduled-docker-build
  tags:
    - bile

docker-build-barbas:
  extends: .scheduled-docker-build
  tags:
    - barbas

docker-build-beleth:
  extends: .scheduled-docker-build
  tags:
    - beleth

docker-build-baka:
  extends: .scheduled-docker-build
  tags:
    - baka

docker-build-bana:
  extends: .scheduled-docker-build
  tags:
    - bana

docker-build-baku:
  extends: .scheduled-docker-build
  tags:
    - selinux
    - self-managed
    - baku

docker-build-baal:
  extends: .scheduled-docker-build
  tags:
    - podman
    - self-managed
    - baal
  script:
    - |
      python_base_image=$(sed -n 's/^ARG PYTHON_BASE_IMAGE=//p' Dockerfile)
      case "$python_base_image" in
        */*) ;;
        *) python_base_image="docker.io/library/${python_base_image}" ;;
      esac
      apt_cache_epoch=$(sh scripts/container/resolve_apt_cache_epoch.sh \
        "$SCHEDULED_APT_CACHE_EPOCH")
      test "$apt_cache_epoch" = "$SCHEDULED_APT_CACHE_EPOCH"
      podman build --build-arg "PYTHON_BASE_IMAGE=${python_base_image}" \
        --build-arg "TARGETARCH=amd64" \
        --build-arg "APT_CACHE_EPOCH=${apt_cache_epoch}" \
        --format docker --tag "darklab_shell:${CI_COMMIT_SHA}" .

.protected-release-tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

.release-image-pipeline:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true" && $RELEASE_MULTIARCH_REHEARSAL == "1"'
    - when: never

.protected-final-release-tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

release-python-base-resolution:
  stage: publish
  image: $CI_DOCKER_IMAGE
  extends: .release-image-pipeline
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache jq python3
  script:
    - scripts/release/publish_release_artifacts.sh resolve-base
  artifacts:
    when: always
    reports:
      dotenv: python-base.env
    paths:
      - python-base-descriptor.txt
      - python-base-index.json
      - python-base-resolution.json
    expire_in: 1 week

release-image-staging-cleanup:
  stage: publish
  image: $CI_DEFAULT_IMAGE
  resource_group: release-image-staging-cleanup
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_REF_PROTECTED == "true" && $RELEASE_STAGING_CLEANUP_ENABLED == "1"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true" && $RELEASE_STAGING_CLEANUP_ENABLED == "1"'
      when: manual
    - when: never
  before_script: []
  script:
    - test -n "$RELEASE_REGISTRY_CLEANUP_TOKEN"
    - |
      cleanup_options=
      if [ "$RELEASE_STAGING_CLEANUP_DRY_RUN" = "1" ]; then
        cleanup_options=--dry-run
      fi
      registry_path=${CI_REGISTRY_IMAGE#*/}
      # shellcheck disable=SC2086  # The optional dry-run flag is intentionally expanded.
      python scripts/release/cleanup_release_image_tags.py \
        --api-url "$CI_API_V4_URL" \
        --token "$RELEASE_REGISTRY_CLEANUP_TOKEN" \
        --project-id "$CI_PROJECT_ID" \
        --registry-path "$registry_path" \
        --keep-days "$RELEASE_STAGING_KEEP_DAYS" \
        $cleanup_options

release-image-amd64:
  stage: publish
  image: $CI_DOCKER_IMAGE
  extends: .release-image-pipeline
  needs:
    - job: release-python-base-resolution
      artifacts: true
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
    RELEASE_ARCHITECTURE: "amd64"
  resource_group: release-cache-amd64
  before_script:
    - apk add --no-cache jq python3
  script:
    - scripts/release/publish_release_artifacts.sh gitlab-platform-image
  artifacts:
    when: always
    reports:
      dotenv: release-image-amd64.env
    paths:
      - gitlab-amd64-manifest.json
      - release-build-amd64-metadata.json
      - release-image-amd64-build-metrics.txt
      - release-image-amd64-status.txt
      - release-platform-amd64.json
    expire_in: 1 week

.release-arm64-dind:
  image: $CI_DOCKER_IMAGE
  services:
    - name: "${CI_DOCKER_IMAGE}-dind"
      alias: docker
      command:
        - "--mtu=1360"
        - "--tls=false"
  tags:
    - saas-linux-small-arm64
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - apk add --no-cache jq python3
    - |
      attempts=0
      until docker info >/dev/null 2>&1; do
        attempts=$((attempts + 1))
        if [ "$attempts" -ge 30 ]; then
          echo "Docker daemon did not become ready after 60 seconds" >&2
          exit 1
        fi
        sleep 2
      done
    - |
      [ "$(uname -m)" = "aarch64" ] || {
        printf 'ARM64 publication requires a native aarch64 runner; found %s\n' "$(uname -m)" >&2
        exit 1
      }

release-image-arm64:
  extends: .release-arm64-dind
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true" && $RELEASE_PLATFORM_MODE == "dual"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true" && $RELEASE_MULTIARCH_REHEARSAL == "1" && $RELEASE_PLATFORM_MODE == "dual"'
    - when: never
  needs:
    - job: release-python-base-resolution
      artifacts: true
  variables:
    RELEASE_ARCHITECTURE: "arm64"
  script:
    - |
      record_daemon_disk_metrics() {
        metric_phase=$1
        docker run --rm --entrypoint sh \
          -e "METRIC_PHASE=${metric_phase}" \
          -v /var/lib/docker:/host-docker:ro \
          "$CI_DOCKER_IMAGE" \
          -c '
            set -- $(df -Pk /host-docker | tail -n 1)
            printf "docker_disk_%s_total_kb=%s\n" "$METRIC_PHASE" "$2"
            printf "docker_disk_%s_used_kb=%s\n" "$METRIC_PHASE" "$3"
            printf "docker_disk_%s_available_kb=%s\n" "$METRIC_PHASE" "$4"
            printf "docker_disk_%s_capacity=%s\n" "$METRIC_PHASE" "$5"
          '
      }
      started_at=$(date +%s)
      printf 'runner_architecture=%s\njob_timeout_seconds=%s\n' \
        "$(uname -m)" "${CI_JOB_TIMEOUT:-unknown}" > release-image-arm64-runner-metrics.txt
      docker pull "$CI_DOCKER_IMAGE"
      metrics_status=0
      record_daemon_disk_metrics before \
        >> release-image-arm64-runner-metrics.txt || metrics_status=$?
      set +e
      scripts/release/publish_release_artifacts.sh gitlab-platform-image
      publish_status=$?
      set -e
      printf 'wall_seconds=%s\n' "$(($(date +%s) - started_at))" \
        >> release-image-arm64-runner-metrics.txt
      record_daemon_disk_metrics after \
        >> release-image-arm64-runner-metrics.txt || metrics_status=$?
      docker system df -v >> release-image-arm64-runner-metrics.txt 2>&1 || true
      [ "$publish_status" -eq 0 ] || exit "$publish_status"
      exit "$metrics_status"
  artifacts:
    when: always
    reports:
      dotenv: release-image-arm64.env
    paths:
      - gitlab-arm64-manifest.json
      - release-build-arm64-metadata.json
      - release-image-arm64-build-metrics.txt
      - release-image-arm64-status.txt
      - release-image-arm64-runner-metrics.txt
      - release-platform-arm64.json
    expire_in: 1 week

release-image-amd64-smoke:
  stage: verify
  image: $CI_DOCKER_IMAGE
  extends: .release-image-pipeline
  needs:
    - job: release-image-amd64
      artifacts: true
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache jq
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - |
      pull_started=$(date +%s)
      docker pull "$AMD64_IMAGE@$AMD64_DIGEST"
      pull_seconds=$(($(date +%s) - pull_started))
      unpacked_bytes=$(docker image inspect --format '{{.Size}}' "$AMD64_IMAGE@$AMD64_DIGEST")
      case "$unpacked_bytes" in
        ''|*[!0-9]*|0) echo "Release image unpacked size is missing or malformed" >&2; exit 1 ;;
      esac
      printf 'compressed_bytes=%s\nunpacked_bytes=%s\npull_seconds=%s\n' \
        "$AMD64_COMPRESSED_BYTES" "$unpacked_bytes" "$pull_seconds" \
        > release-image-amd64-metrics.txt
      jq --argjson unpacked_bytes "$unpacked_bytes" --argjson pull_seconds "$pull_seconds" \
        '. + {unpacked_bytes:$unpacked_bytes, pull_seconds:$pull_seconds}' \
        release-platform-amd64.json > release-platform-amd64.updated.json
      mv release-platform-amd64.updated.json release-platform-amd64.json
      printf 'AMD64_UNPACKED_BYTES=%s\nAMD64_PULL_SECONDS=%s\n' \
        "$unpacked_bytes" "$pull_seconds" > release-image-amd64-measurements.env
      printf 'RELEASE_VERSION=%s\nAMD64_IMAGE=%s\nAMD64_DIGEST=%s\nAMD64_COMPRESSED_BYTES=%s\nAMD64_PYTHON_BASE_DIGEST=%s\n' \
        "$RELEASE_VERSION" "$AMD64_IMAGE" "$AMD64_DIGEST" \
        "$AMD64_COMPRESSED_BYTES" "$AMD64_PYTHON_BASE_DIGEST" \
        >> release-image-amd64-measurements.env
    - >-
      CONTAINER_MOUNT_MODE=volume sh scripts/release/verify_repository_free_image.sh
      "$AMD64_IMAGE@$AMD64_DIGEST" "$RELEASE_VERSION" "$CI_COMMIT_SHA"
      "$AMD64_PYTHON_BASE_DIGEST" amd64
    - sh scripts/release/verify_bundled_tools.sh "$AMD64_IMAGE@$AMD64_DIGEST" amd64
  artifacts:
    when: always
    reports:
      dotenv: release-image-amd64-measurements.env
    paths:
      - release-image-amd64-metrics.txt
      - release-platform-amd64.json
    expire_in: 1 week

release-image-amd64-vulnerability-scan:
  stage: verify
  image: $CI_DOCKER_IMAGE
  extends: .release-image-pipeline
  needs:
    - job: release-image-amd64
      artifacts: true
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
  before_script: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$AMD64_IMAGE@$AMD64_DIGEST"
    - docker pull "$SYFT_IMAGE"
    - docker pull "$GRYPE_IMAGE"
    - mkdir -p release-evidence-amd64
    - >-
      docker run --rm
      --user 0:0
      -v /var/run/docker.sock:/var/run/docker.sock
      "$SYFT_IMAGE"
      "docker:${AMD64_IMAGE}@${AMD64_DIGEST}"
      -o cyclonedx-json
      > release-evidence-amd64/darklab-shell-amd64.cdx.json
    - >-
      cat release-evidence-amd64/darklab-shell-amd64.cdx.json |
      docker run --rm -i
      "$GRYPE_IMAGE"
      --only-fixed --fail-on critical -o json
      > release-evidence-amd64/vulnerability-report-amd64.json
  artifacts:
    when: always
    paths:
      - release-evidence-amd64/darklab-shell-amd64.cdx.json
      - release-evidence-amd64/vulnerability-report-amd64.json
    expire_in: 1 week

release-image-recheck:
  stage: verify
  image: $CI_DOCKER_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_TLS_CERTDIR: ""
    RECHECK_ARCHITECTURE: "amd64"
    RECHECK_REFERENCE_KIND: "child"
  before_script: []
  script:
    - test -n "$RECHECK_IMAGE"
    - printf '%s' "$RECHECK_IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
    - test -n "$RECHECK_VERSION"
    - printf '%s' "$RECHECK_REVISION" | grep -Eq '^[0-9a-f]{40,64}$'
    - printf '%s' "$RECHECK_PYTHON_BASE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - |
      case "$RECHECK_REFERENCE_KIND" in
        child)
          recheck_reference="$RECHECK_IMAGE@$RECHECK_IMAGE_DIGEST"
          ;;
        index)
          recheck_reference="$RECHECK_IMAGE@$RECHECK_IMAGE_DIGEST"
          index_child_digest=$(docker buildx imagetools inspect "$recheck_reference" \
            --format "{{range .Manifest.Manifests}}{{if eq .Platform.Architecture \"${RECHECK_ARCHITECTURE}\"}}{{.Digest}}{{end}}{{end}}")
          printf '%s' "$RECHECK_CHILD_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$index_child_digest" = "$RECHECK_CHILD_DIGEST"
          ;;
        *) echo "RECHECK_REFERENCE_KIND must be child or index" >&2; exit 2 ;;
      esac
      docker pull --platform "linux/${RECHECK_ARCHITECTURE}" "$recheck_reference"
    - >-
      CONTAINER_MOUNT_MODE=volume
      sh scripts/release/verify_repository_free_image.sh
      "$recheck_reference"
      "$RECHECK_VERSION"
      "$RECHECK_REVISION"
      "$RECHECK_PYTHON_BASE_DIGEST"
      "$RECHECK_ARCHITECTURE"
    - sh scripts/release/verify_bundled_tools.sh "$recheck_reference" "$RECHECK_ARCHITECTURE"
    - docker pull "$SYFT_IMAGE"
    - docker pull "$GRYPE_IMAGE"
    - mkdir -p recheck-evidence
    - >-
      docker run --rm
      --user 0:0
      -v /var/run/docker.sock:/var/run/docker.sock
      "$SYFT_IMAGE"
      "docker:${recheck_reference}"
      -o cyclonedx-json
      > recheck-evidence/darklab-shell.cdx.json
    - >-
      cat recheck-evidence/darklab-shell.cdx.json |
      docker run --rm -i
      "$GRYPE_IMAGE"
      --only-fixed --fail-on critical -o json
      > recheck-evidence/vulnerability-report.json
  artifacts:
    when: always
    paths:
      - recheck-evidence/darklab-shell.cdx.json
      - recheck-evidence/vulnerability-report.json
    expire_in: 1 week

release-image-arm64-smoke:
