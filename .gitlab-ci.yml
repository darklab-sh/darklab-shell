release-image-selinux-smoke:
  stage: verify
  image: $CI_DOCKER_IMAGE
  tags:
    - selinux
    - self-managed
    - baku
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true" && $RELEASE_SELINUX_COMPATIBILITY_ENABLED == "1"'
    - when: never
  needs:
    - job: release-image-amd64
      artifacts: true
  hooks:
    pre_get_sources_script:
      - |
        for stale_dir in "$CI_PROJECT_DIR"/.darklab-release-deployment.*; do
          [ -d "$stale_dir" ] || continue
          docker run --rm --entrypoint sh \
            -v "$stale_dir:/cleanup:Z" "$CI_DOCKER_IMAGE" \
            -c 'rm -rf /cleanup/* /cleanup/.[!.]* /cleanup/..?* 2>/dev/null || true; chmod 0777 /cleanup'
          rmdir "$stale_dir"
        done
  before_script: []
  script:
    - getenforce | tee selinux-enforcement.txt
    - grep -qx Enforcing selinux-enforcement.txt
    - docker info --format '{{json .SecurityOptions}}' | tee selinux-docker-security.json
    - grep -qi selinux selinux-docker-security.json
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$AMD64_IMAGE@$AMD64_DIGEST"
    - CONTAINER_VOLUME_LABEL=Z sh scripts/release/verify_repository_free_image.sh "$AMD64_IMAGE@$AMD64_DIGEST" "$RELEASE_VERSION" "$CI_COMMIT_SHA" "$AMD64_PYTHON_BASE_DIGEST" amd64
