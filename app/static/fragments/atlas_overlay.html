<div id="atlas-overlay" class="mobile-sheet-overlay u-hidden" aria-hidden="true">
  <section id="atlas-surface" class="atlas-surface mobile-sheet-surface" role="dialog" aria-modal="true" aria-labelledby="atlas-title">
    <div class="sheet-grab gesture-handle" role="button" tabindex="0" aria-label="Close Atlas"></div>
    <div class="atlas-header surface-header">
      <div>
        <span class="atlas-title" id="atlas-title">ATLAS</span>
        <div class="atlas-subtitle" id="atlas-subtitle">0 entities</div>
      </div>
      <button type="button" class="close-btn atlas-close" aria-label="Close Atlas">✕</button>
    </div>
    <div id="atlas-tabs" class="atlas-tabs tab-strip" role="tablist" aria-label="Atlas entity types"></div>
    <section id="atlas-quick-lookup" class="atlas-quick-lookup u-hidden" aria-labelledby="atlas-lookup-title">
      <div id="atlas-lookup-form-view" class="atlas-lookup-form-view">
        <form id="atlas-lookup-form" class="atlas-lookup-form">
          <div class="atlas-lookup-heading">
            <span class="atlas-title" id="atlas-lookup-title">QUICK LOOKUP</span>
            <p>Find a saved hostname, IP address, or HTTP(S) URL without searching Atlas lists.</p>
          </div>
          <label class="form-field atlas-lookup-value-field">
            <span>Entity</span>
            <input id="atlas-lookup-input" class="form-control" type="text" placeholder="example.com, 192.0.2.10, or https://example.com/path" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text">
          </label>
          <div class="atlas-lookup-controls">
            <label class="form-field">
              <span>Type</span>
              <select id="atlas-lookup-mode" class="form-select form-control-compact">
                <option value="auto">Auto</option>
                <option value="hostname">Hostname</option>
                <option value="ip">IP</option>
                <option value="url">URL</option>
              </select>
            </label>
            <div class="atlas-lookup-scope-field">
              <span>Scope</span>
              <strong id="atlas-lookup-scope" class="atlas-lookup-scope">Personal</strong>
            </div>
            <button class="btn btn-primary atlas-lookup-submit" type="submit">Look up</button>
          </div>
          <div class="atlas-lookup-form-footer">
            <span id="atlas-lookup-status" class="atlas-lookup-status u-hidden" role="status" aria-live="polite"></span>
            <button id="atlas-lookup-resume" class="btn btn-ghost btn-compact u-hidden" type="button">Return to current result</button>
          </div>
        </form>
      </div>
      <div id="atlas-lookup-outcome-view" class="atlas-lookup-outcome-view u-hidden">
        <div class="atlas-lookup-empty-card" aria-live="polite">
          <span class="atlas-title" id="atlas-lookup-outcome-title">No saved Atlas entity</span>
          <p id="atlas-lookup-outcome-body"></p>
          <div id="atlas-lookup-outcome-context" class="atlas-lookup-outcome-context u-hidden"></div>
          <div id="atlas-lookup-outcome-candidates" class="atlas-lookup-candidates u-hidden"></div>
          <div id="atlas-lookup-outcome-actions" class="atlas-lookup-outcome-actions">
            <button id="atlas-lookup-outcome-new" class="btn btn-primary btn-compact" type="button">New lookup</button>
          </div>
        </div>
      </div>
      <div id="atlas-lookup-profile-view" class="atlas-lookup-profile-view u-hidden">
        <div class="atlas-lookup-profile-actions">
          <button id="atlas-lookup-profile-new" class="btn btn-secondary btn-compact" type="button">New lookup</button>
          <button id="atlas-lookup-open-atlas" class="btn btn-ghost btn-compact" type="button">Open in Atlas</button>
          <span id="atlas-lookup-profile-scope" class="atlas-muted"></span>
        </div>
        <div id="atlas-lookup-profile" class="atlas-lookup-profile nice-scroll" aria-live="polite"></div>
      </div>
    </section>
    <section id="atlas-mobile-root" class="atlas-mobile-root u-hidden" aria-label="Mobile Atlas">
      <div id="atlas-mobile-list-view" class="atlas-mobile-list-view">
        <div class="atlas-mobile-tabs-wrap">
          <div id="atlas-mobile-tabs" class="atlas-mobile-tabs tab-strip" role="tablist" aria-label="Atlas entity types"></div>
        </div>
        <div id="atlas-mobile-tools" class="atlas-mobile-tools"></div>
        <div id="atlas-mobile-bulk-bar" class="atlas-mobile-bulk-bar u-hidden" aria-live="polite"></div>
        <div id="atlas-mobile-list" class="atlas-mobile-list nice-scroll" aria-live="polite"></div>
        <div id="atlas-mobile-pagination" class="atlas-mobile-pagination u-hidden" aria-live="polite"></div>
      </div>
      <div id="atlas-mobile-entity-view" class="atlas-mobile-detail-view u-hidden" role="region" aria-label="Atlas entity detail">
        <div id="atlas-mobile-entity-topbar" class="atlas-mobile-detail-topbar"></div>
        <div id="atlas-mobile-entity-body" class="atlas-mobile-detail-body nice-scroll" aria-live="polite"></div>
        <div id="atlas-mobile-entity-footer" class="atlas-mobile-detail-footer"></div>
      </div>
      <div id="atlas-mobile-finding-view" class="atlas-mobile-detail-view u-hidden" role="region" aria-label="Atlas finding detail">
        <div id="atlas-mobile-finding-topbar" class="atlas-mobile-detail-topbar"></div>
        <div id="atlas-mobile-finding-body" class="atlas-mobile-detail-body nice-scroll" aria-live="polite"></div>
        <div id="atlas-mobile-finding-footer" class="atlas-mobile-detail-footer"></div>
      </div>
    </section>
    <div class="atlas-shell">
      <div class="atlas-main">
        <div class="atlas-toolbar">
          <div class="atlas-search-row">
            <input id="atlas-search" class="form-control form-control-compact" type="text" placeholder="search atlas" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" aria-label="Search Atlas entities">
          </div>
          <div class="atlas-filter-row">
            <div class="atlas-filter-controls">
              <input id="atlas-run-filter-search" class="form-control form-control-compact atlas-run-filter-search" type="search" placeholder="search runs" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" aria-label="Search runs for Atlas filter">
              <select id="atlas-run-filter-select" class="form-select form-control-compact atlas-run-filter-select" aria-label="Filter Atlas by source run"></select>
              <div id="atlas-run-filter-chip" class="atlas-run-filter-chip u-hidden"></div>
              <select id="atlas-project-filter-select" class="form-select form-control-compact atlas-project-filter-select" aria-label="Filter Atlas by project"></select>
              <div id="atlas-project-filter-chip" class="atlas-project-filter-chip u-hidden"></div>
              <select id="atlas-finding-status-filter" class="form-select form-control-compact u-hidden" aria-label="Filter Atlas findings by status"></select>
              <select id="atlas-orphan-filter" class="form-select form-control-compact atlas-orphan-filter" aria-label="Filter Atlas rows by source run"></select>
              <select id="atlas-suppression-filter" class="form-select form-control-compact atlas-suppression-filter" aria-label="Filter Atlas rows by suppression state"></select>
            </div>
            <div class="atlas-toolbar-actions">
              <button id="atlas-import-btn" class="btn btn-secondary btn-compact" type="button">Import</button>
              <div id="atlas-export-wrap" class="atlas-export-wrap save-menu-wrap save-menu-down">
                <button id="atlas-export-menu-btn" class="btn btn-ghost btn-compact" type="button" aria-expanded="false">Export</button>
                <div id="atlas-export-menu" class="atlas-export-menu save-menu dropdown-surface">
                  <button id="atlas-export-csv-btn" class="dropdown-item dropdown-item-compact" type="button">CSV</button>
                  <button id="atlas-export-jsonl-btn" class="dropdown-item dropdown-item-compact" type="button">JSONL</button>
                </div>
              </div>
              <button id="atlas-refresh-btn" class="btn btn-secondary btn-compact" type="button">Refresh</button>
              <button id="atlas-findings-board-btn" class="btn btn-secondary btn-compact" type="button">Board</button>
              <button id="atlas-clear-filters-btn" class="btn btn-ghost btn-compact" type="button">Clear filters</button>
            </div>
          </div>
          <div class="atlas-saved-view-row">
            <div class="atlas-saved-view-select-cell">
              <select id="atlas-saved-view-select" class="form-select form-control-compact atlas-saved-view-select" aria-label="Saved Atlas views"></select>
            </div>
            <button id="atlas-saved-view-save" class="btn btn-secondary btn-compact" type="button">Save view</button>
            <button id="atlas-saved-view-update" class="btn btn-ghost btn-compact" type="button">Update</button>
            <button id="atlas-saved-view-delete" class="btn btn-ghost btn-compact" type="button">Delete</button>
            <button id="atlas-saved-view-create-rule" class="btn btn-ghost btn-compact" type="button">Create rule</button>
          </div>
          <div id="atlas-finding-bulk-row" class="atlas-finding-bulk-row u-hidden">
            <div class="atlas-bulk-action-row">
              <div class="atlas-bulk-selection-controls">
                <label class="history-bulk-toggle control-row">
                  <input id="atlas-select-toggle" type="checkbox">
                  <span>select</span>
                </label>
                <button id="atlas-finding-select-all" class="btn btn-secondary btn-compact" type="button">Select all</button>
                <button id="atlas-finding-clear-selection" class="btn btn-ghost btn-compact" type="button">Clear</button>
                <span id="atlas-finding-selection-summary" class="atlas-muted atlas-bulk-selection-summary">0 selected</span>
              </div>
              <div class="atlas-bulk-mutation-controls">
                <select id="atlas-finding-bulk-status" class="form-select form-control-compact" aria-label="Bulk finding review state"></select>
                <button id="atlas-finding-bulk-apply" class="btn btn-secondary btn-compact" type="button">Apply</button>
                <button id="atlas-bulk-suppression" class="btn btn-secondary btn-compact" type="button">Suppress</button>
                <button id="atlas-bulk-delete" class="btn btn-secondary btn-danger btn-compact" type="button">Delete</button>
              </div>
            </div>
          </div>
        </div>
        <div id="atlas-list" class="atlas-list nice-scroll" aria-live="polite"></div>
        <div id="atlas-pagination" class="atlas-pagination u-hidden" aria-live="polite">
          <span id="atlas-pagination-summary" class="atlas-pagination-summary"></span>
          <button id="atlas-prev-btn" class="btn btn-secondary btn-compact" type="button">Previous</button>
          <button id="atlas-next-btn" class="btn btn-secondary btn-compact" type="button">Next</button>
        </div>
      </div>
      <aside id="atlas-detail" class="atlas-detail nice-scroll" aria-live="polite"></aside>
    </div>
    <div id="atlas-import-overlay" class="modal-overlay mobile-sheet-overlay atlas-import-overlay u-hidden" aria-hidden="true">
      <form id="atlas-import-modal" class="modal-card mobile-sheet-surface atlas-import-modal" role="dialog" aria-modal="true" aria-labelledby="atlas-import-title" tabindex="-1">
        <div class="surface-header">
          <div>
            <span class="faq-title" id="atlas-import-title">IMPORT ATLAS DATA</span>
            <div class="atlas-import-subtitle" id="atlas-import-subtitle">External findings and entities</div>
          </div>
          <button type="button" class="close-btn" id="atlas-import-close" aria-label="Close import">✕</button>
        </div>
        <div class="atlas-import-body nice-scroll">
          <section class="atlas-import-section">
            <div class="atlas-detail-section-title">Source</div>
            <div class="atlas-import-grid">
              <label class="form-field">
                <span>Format</span>
                <select id="atlas-import-format" class="form-select form-control-compact">
                  <option value="nuclei_jsonl">Nuclei JSONL</option>
                  <option value="nessus_xml">Nessus XML</option>
                  <option value="zap_json">OWASP ZAP JSON</option>
                  <option value="zap_xml">OWASP ZAP XML</option>
                  <option value="burp_xml">Burp Suite XML</option>
                  <option value="generic_csv">Generic CSV</option>
                  <option value="generic_jsonl">Generic JSONL</option>
                </select>
              </label>
              <label class="form-field">
                <span>Name</span>
                <input id="atlas-import-name" class="form-control form-control-compact" type="text" maxlength="120" placeholder="Import name">
              </label>
              <label class="form-field atlas-import-file-field">
                <span>File</span>
                <input id="atlas-import-file" class="form-control form-control-compact" type="file" accept=".jsonl,application/x-ndjson,application/jsonl,application/json">
              </label>
            </div>
            <div class="atlas-import-actions">
              <button id="atlas-import-preview-btn" class="btn btn-secondary btn-compact" type="submit">Preview</button>
              <span id="atlas-import-status" class="atlas-muted" aria-live="polite"></span>
            </div>
          </section>
          <section id="atlas-import-preview" class="atlas-import-section u-hidden" aria-live="polite"></section>
        </div>
        <div class="modal-actions atlas-import-footer">
          <button id="atlas-import-cancel" class="btn btn-ghost btn-compact" type="button">Cancel</button>
          <button id="atlas-import-apply" class="btn btn-secondary btn-compact" type="button" disabled>Apply import</button>
        </div>
      </form>
    </div>
  </section>
</div>
