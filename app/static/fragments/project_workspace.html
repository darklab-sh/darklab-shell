<div id="project-workspace-overlay" class="modal-overlay mobile-sheet-overlay u-hidden" aria-hidden="true">
  <div id="project-workspace-modal" class="modal-card mobile-sheet-surface" role="dialog" aria-modal="true" aria-labelledby="project-workspace-title">
    <div class="faq-header">
      <div>
        <span class="faq-title" id="project-workspace-title">PROJECTS</span>
        <div class="project-workspace-subtitle" id="project-workspace-subtitle">Select a project to review its targets, runs, findings, artifacts, and packages.</div>
      </div>
      <button type="button" class="close-btn project-workspace-close" aria-label="Close projects">✕</button>
    </div>
    <div id="project-workspace-message" class="project-workspace-message u-hidden" role="status">
      <span class="project-workspace-message-text"></span>
      <button type="button" class="btn btn-ghost btn-compact project-workspace-message-dismiss" data-project-message-dismiss aria-label="Dismiss project message">✕</button>
    </div>
    <section id="project-mobile-root" class="project-mobile-root" aria-label="Mobile projects">
      <div id="project-mobile-list-view" class="project-mobile-list-view">
        <div class="project-mobile-header">
          <div class="project-mobile-heading">
            <span id="project-mobile-summary" class="project-mobile-summary">No projects loaded</span>
          </div>
          <button type="button" id="project-mobile-new-btn" class="btn btn-secondary btn-compact" data-project-mobile-action="new-project">New Project</button>
        </div>
        <div id="project-mobile-body" class="project-mobile-body nice-scroll" aria-live="polite"></div>
        <div id="project-mobile-pagination" class="project-workspace-pagination u-hidden" aria-live="polite"></div>
      </div>
      <form id="project-mobile-create-form" class="project-mobile-create-sheet u-hidden" aria-label="Create project">
        <div class="project-mobile-create-header">
          <div class="project-mobile-heading">
            <span class="project-mobile-kicker">New Project</span>
            <span class="project-mobile-summary">Name the project to start grouping related work.</span>
          </div>
          <button type="button" class="btn btn-ghost btn-compact" data-project-mobile-action="cancel-create">Back</button>
        </div>
        <label class="project-mobile-create-field">
          <span>Name</span>
          <input id="project-mobile-name" class="form-control form-control-compact" type="text" maxlength="120" placeholder="New project name" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" aria-label="New project name">
        </label>
        <div class="project-mobile-create-actions">
          <button type="submit" class="btn btn-secondary btn-compact">Create project</button>
        </div>
      </form>
      <div id="project-mobile-detail-view" class="project-mobile-detail-view u-hidden">
        <div id="project-mobile-detail-topbar" class="project-mobile-detail-topbar"></div>
        <div class="project-mobile-tabs-wrap">
          <div id="project-mobile-tabs" class="project-mobile-tabs tab-strip" role="tablist" aria-label="Project sections"></div>
        </div>
        <div id="project-mobile-detail-body" class="project-mobile-detail-body nice-scroll" aria-live="polite"></div>
      </div>
    </section>
    <div class="project-workspace-layout">
      <aside class="project-workspace-sidebar" aria-label="Project list">
        <form id="project-workspace-create-form" class="project-workspace-create">
          <input id="project-workspace-name" class="form-control form-control-compact" type="text" maxlength="120" placeholder="New project name" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" aria-label="New project name">
          <button type="submit" class="btn btn-secondary btn-compact">Create</button>
        </form>
        <div id="project-workspace-body" class="project-workspace-body nice-scroll" aria-live="polite"></div>
        <div id="project-workspace-pagination" class="project-workspace-pagination u-hidden" aria-live="polite"></div>
      </aside>
      <section class="project-explorer" aria-label="Selected project">
        <div id="project-explorer-body" class="project-explorer-body nice-scroll" aria-live="polite"></div>
      </section>
    </div>
    <form id="project-notes-form" class="project-notes-form u-hidden">
      <textarea id="project-notes-input" class="form-control form-control-compact project-notes-input" maxlength="20000" rows="3" placeholder="Notes for selected project" autocomplete="off" autocapitalize="sentences" spellcheck="true" aria-label="Selected project notes"></textarea>
    </form>
    <form id="project-labels-form" class="project-labels-form u-hidden">
      <input id="project-labels-input" class="form-control form-control-compact" type="text" maxlength="512" placeholder="important, retest" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" aria-label="Selected project labels">
      <button type="submit" class="btn btn-secondary btn-compact" id="project-labels-save-btn">Save labels</button>
    </form>
  </div>
  <div id="project-target-editor-overlay" class="modal-overlay mobile-sheet-overlay project-target-editor-overlay u-hidden" aria-hidden="true">
    <div id="project-target-editor-modal" class="modal-card modal-card-compact mobile-sheet-surface project-target-editor-modal" role="dialog" aria-modal="true" aria-labelledby="project-target-editor-title">
      <div class="sheet-grab gesture-handle" role="button" tabindex="0" aria-label="Close target editor"></div>
      <div class="faq-header">
        <span class="faq-title" id="project-target-editor-title">NEW TARGET</span>
        <button type="button" class="close-btn project-target-editor-close" aria-label="Close target editor">✕</button>
      </div>
      <form id="project-target-create-form" class="project-target-editor-form">
        <label class="project-target-edit-field">
          <span>Type</span>
          <select id="project-target-type" class="form-select form-control-compact" aria-label="Project target type">
            <option value="domain">domain</option>
            <option value="url">url</option>
            <option value="ip">ip</option>
          </select>
        </label>
        <label class="project-target-edit-field">
          <span>Value</span>
          <input id="project-target-value" class="form-control form-control-compact" type="text" maxlength="512" placeholder="target.example.com" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" aria-label="Project target value" aria-describedby="project-target-value-help project-target-value-error">
          <small id="project-target-value-help" class="project-target-value-help">Domain name only. Examples: darklab.sh, api.darklab.sh</small>
          <div id="project-target-value-error" class="form-error project-target-value-error u-hidden" role="alert"></div>
        </label>
        <label class="project-target-edit-field">
          <span>Labels</span>
          <input id="project-target-label" class="form-control form-control-compact" type="text" maxlength="2000" placeholder="Comma-separated labels" autocomplete="off" autocapitalize="sentences" spellcheck="true" aria-label="Project target labels">
        </label>
        <label class="project-target-edit-field">
          <span>Notes</span>
          <textarea id="project-target-notes" class="form-control form-control-compact" maxlength="20000" rows="3" placeholder="Optional notes" autocomplete="off" autocapitalize="sentences" spellcheck="true" aria-label="Project target notes"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary btn-compact project-target-editor-cancel">Cancel</button>
          <button type="submit" id="project-target-submit" class="btn btn-primary btn-compact">Add Target</button>
        </div>
      </form>
    </div>
  </div>
  <div id="project-package-manifest-overlay" class="modal-overlay mobile-sheet-overlay project-package-manifest-overlay u-hidden" aria-hidden="true">
    <div id="project-package-manifest-modal" class="modal-card modal-card-compact mobile-sheet-surface project-package-manifest-modal" role="dialog" aria-modal="true" aria-labelledby="project-package-manifest-title">
      <div class="sheet-grab gesture-handle" role="button" tabindex="0" aria-label="Close package manifest"></div>
      <div class="faq-header">
        <span class="faq-title" id="project-package-manifest-title">PACKAGE MANIFEST</span>
        <button type="button" class="close-btn project-package-manifest-close" aria-label="Close package manifest">✕</button>
      </div>
      <div id="project-package-manifest-summary" class="project-package-manifest-summary"></div>
      <pre id="project-package-manifest-json" class="project-package-manifest-json nice-scroll"></pre>
    </div>
  </div>
  <div id="project-package-wizard-overlay" class="modal-overlay mobile-sheet-overlay project-package-wizard-overlay u-hidden" aria-hidden="true">
    <div id="project-package-wizard-modal" class="modal-card mobile-sheet-surface project-package-wizard-modal" role="dialog" aria-modal="true" aria-labelledby="project-package-wizard-title">
      <div class="sheet-grab gesture-handle" role="button" tabindex="0" aria-label="Close package wizard"></div>
      <div id="project-package-wizard-body"></div>
    </div>
  </div>
</div>

<div id="project-entity-editor-overlay" class="modal-overlay mobile-sheet-overlay project-entity-editor-overlay u-hidden" aria-hidden="true">
  <div id="project-entity-editor-modal" class="modal-card modal-card-compact mobile-sheet-surface project-entity-editor-modal" role="dialog" aria-modal="true" aria-labelledby="project-entity-editor-title">
    <div class="sheet-grab gesture-handle" role="button" tabindex="0" aria-label="Close metadata editor"></div>
    <div class="faq-header">
      <div>
        <span class="faq-title" id="project-entity-editor-title">EDIT METADATA</span>
        <div class="project-entity-editor-subtitle" id="project-entity-editor-subtitle"></div>
      </div>
      <button type="button" class="close-btn project-entity-editor-close" aria-label="Close metadata editor">✕</button>
    </div>
    <form id="project-entity-editor-form" class="project-target-editor-form project-entity-editor-form">
      <label class="project-target-edit-field">
        <span>Labels</span>
        <input id="project-entity-labels" class="form-control form-control-compact" type="text" maxlength="512" placeholder="important, retest" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" aria-label="Entity labels">
        <small class="project-target-value-help">Comma-separated labels. Existing labels not listed here will be removed.</small>
      </label>
      <label class="project-target-edit-field">
        <span>Note</span>
        <textarea id="project-entity-note" class="form-control form-control-compact" maxlength="20000" rows="4" placeholder="Optional note" autocomplete="off" autocapitalize="sentences" spellcheck="true" aria-label="Entity note"></textarea>
      </label>
      <section id="project-entity-activity" class="project-entity-activity" aria-label="Recent activity"></section>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary btn-compact project-entity-editor-cancel">Cancel</button>
        <button type="submit" id="project-entity-submit" class="btn btn-primary btn-compact">Save</button>
      </div>
    </form>
  </div>
</div>
