---
version: 1

# App-owned built-in autocomplete grammar. This file intentionally lives outside
# app/conf because built-ins are code behavior, not operator policy.
commands:
  - root: banner
    description: "built-in: print the configured banner art"
    autocomplete:
      arguments: []
  - root: cat
    description: "built-in: show a session file"
    feature_required: workspace
    autocomplete:
      argument_limit: 1
      arguments: []
  - root: cd
    description: "built-in: change the current workspace folder"
    feature_required: workspace
    autocomplete:
      argument_limit: 1
      arguments: []
  - root: clear
    description: "built-in: clear the current terminal tab output"
    autocomplete:
      arguments: []
  - root: commands
    description: "built-in: list built-in and allowed external commands"
    autocomplete:
      flags:
        - value: --built-in
          description: "Show only built-in shell commands"
        - value: --external
          description: "Show only allowed external commands"
      subcommands:
        - value: info
          description: "Show details for one supported command"
          takes_value: true
          insert: "info "
  - root: config
    description: "built-in: show or update user options"
    autocomplete:
      subcommands:
        - value: list
          description: "Show all current user config"
          closes: true
        - value: get
          description: "Show one user config value"
          takes_value: true
          insert: "get "
        - value: set
          description: "Set one user config value"
          takes_value: true
          insert: "set "
  - root: date
    description: "built-in: show the current server time"
    autocomplete:
      arguments: []
  - root: df
    description: "built-in: show a compact filesystem summary"
    autocomplete:
      flags:
        - value: -h
          description: "Human-readable disk usage"
  - root: env
    description: "built-in: show core environment values for this shell"
    autocomplete:
      arguments: []
  - root: exit
    description: "built-in: close the current tab"
    autocomplete:
      arguments: []
  - root: faq
    description: "built-in: show configured FAQ entries"
    autocomplete:
      arguments: []
  - root: file
    description: >-
      built-in: list, view, create, edit, download, move, or remove
      session files
    feature_required: workspace
    autocomplete:
      subcommands:
        - value: list
          description: "List current session files"
          takes_value: true
          insert: "list "
          value_hint:
            value: "<folder>"
            hint_only: true
            description: "Session folder"
        - value: ls
          description: "List current session files"
          takes_value: true
          insert: "ls "
          value_hint:
            value: "<folder>"
            hint_only: true
            description: "Session folder"
        - value: show
          description: "Print a session file in the terminal"
          takes_value: true
          insert: "show "
          value_hint:
            value: "<file>"
            hint_only: true
            description: "Session file"
        - value: add
          description: "Open the Files editor for a new session file"
          takes_value: true
          insert: "add "
          value_hint:
            value: "<file>"
            hint_only: true
            description: "New session file name"
        - value: add-dir
          description: "Create a session folder"
          takes_value: true
          insert: "add-dir "
          value_hint:
            value: "<folder>"
            hint_only: true
            description: "New session folder"
        - value: edit
          description: "Open the Files editor for an existing session file"
          takes_value: true
          insert: "edit "
          value_hint:
            value: "<file>"
            hint_only: true
            description: "Session file"
        - value: download
          description: "Download a session file through the browser"
          takes_value: true
          insert: "download "
          value_hint:
            value: "<file>"
            hint_only: true
            description: "Session file"
        - value: move
          description: "Move or rename a session file or folder"
          takes_value: true
          insert: "move "
          value_hint:
            value: "<source> <destination>"
            hint_only: true
            value_type: target
            description: "Session file or folder path"
        - value: rm
          description: "Remove a session file from this session"
          takes_value: true
          hidden: true
          insert: "rm "
          value_hint:
            value: "<file>"
            hint_only: true
            description: "Session file"
        - value: delete
          description: "Remove a session file from this session"
          takes_value: true
          insert: "delete "
          value_hint:
            value: "<file>"
            hint_only: true
            description: "Session file"
        - value: help
          description: "Show file command usage"
          closes: true
  - root: fortune
    description: "built-in: print a short operator-themed one-liner"
    autocomplete:
      arguments: []
  - root: free
    description: "built-in: show a compact memory summary"
    autocomplete:
      flags:
        - value: -h
          description: "Human-readable memory usage"
  - root: groups
    description: "built-in: show the shell group membership"
    autocomplete:
      arguments: []
  - root: grep
    description: "built-in: filter a session file"
    feature_required: workspace
    autocomplete:
      flags:
        - value: -i
          description: "Ignore case"
        - value: -v
          description: "Invert match"
        - value: -E
          description: "Extended regex"
      argument_limit: 2
      arguments: []
  - root: head
    description: "built-in: print the first lines of a session file"
    feature_required: workspace
    autocomplete:
      flags:
        - value: -n
          description: "Line count"
          takes_value: true
          suggest:
            - value: "10"
              description: "Ten lines"
      argument_limit: 1
      arguments: []
  - root: help
    description: >-
      built-in: show README, FAQ, shortcuts, and command-discovery guidance
    autocomplete:
      arguments: []
  - root: history
    description: "built-in: list command history from this session"
    autocomplete:
      arguments: []
  - root: hostname
    description: "built-in: show the configured shell instance name"
    autocomplete:
      arguments: []
  - root: id
    description: "built-in: show the shell identity"
    autocomplete:
      arguments: []
  - root: intel
    description: "built-in: query configured external intel providers"
    autocomplete:
      subcommands:
        - value: ip
          description: "Look up an IP address"
          takes_value: true
          insert: "ip "
          value_hint:
            value: "<ip>"
            hint_only: true
            value_type: ip
            description: "IP address"
        - value: domain
          description: "Look up a domain"
          takes_value: true
          insert: "domain "
          value_hint:
            value: "<domain>"
            hint_only: true
            value_type: domain
            description: "Domain"
        - value: hash
          description: "Look up a file hash"
          takes_value: true
          insert: "hash "
          value_hint:
            value: "<md5|sha1|sha256>"
            hint_only: true
            description: "File hash"
      flags:
        - value: --include-private
          description: "Allow private or loopback IP lookups"
  - root: ip
    description: "built-in: show a minimal shell network interface view"
    autocomplete:
      arguments:
        - value: a
          description: "Show all network interfaces and addresses"
  - root: jobs
    description: "built-in: alias for runs"
    autocomplete:
      flags:
        - value: -v
          description: "Show full IDs, started timestamps, and metadata source"
        - value: --verbose
          description: "Show full IDs, started timestamps, and metadata source"
        - value: --json
          description: "Print active-run metadata as JSON"
  - root: last
    description: >-
      built-in: show recent completed runs with timestamps and exit codes
    autocomplete:
      arguments: []
  - root: limits
    description: >-
      built-in: show configured runtime, history, and retention limits
    autocomplete:
      arguments: []
  - root: ll
    description: "built-in: long-list session files"
    feature_required: workspace
    autocomplete:
      flags:
        - value: -R
          description: "Recursive listing"
      argument_limit: 1
      arguments: []
  - root: ls
    description: "built-in: list session files"
    feature_required: workspace
    autocomplete:
      flags:
        - value: -l
          description: "Long listing"
        - value: -R
          description: "Recursive listing"
      argument_limit: 1
      arguments: []
  - root: mkdir
    description: "built-in: create a session folder"
    feature_required: workspace
    autocomplete:
      argument_limit: 1
      arguments: []
  - root: mv
    description: "built-in: move or rename a session file or folder"
    feature_required: workspace
    autocomplete:
      argument_limit: 2
      arguments:
        - value: "<source> <destination>"
          hint_only: true
          value_type: target
          description: "Session file or folder path"
  - root: man
    description: "built-in: show a real or built-in manual page"
    autocomplete:
      argument_limit: 1
      arguments: []
  - root: ps
    description: "built-in: show the current shell process view"
    autocomplete:
      flags:
        - value: aux
          description: "All processes with user and memory info"
        - value: -ef
          description: "All processes, full format"
  - root: pwd
    description: "built-in: show the session files path"
    autocomplete:
      arguments: []
  - root: project
    description: "built-in: create, select, link, and annotate project workspaces"
    autocomplete:
      subcommands:
        list:
          description: "List current-session projects"
          flags:
            - value: --all
              description: "Include archived projects"
            - value: -a
              description: "Include archived projects"
        create:
          description: "Create and activate a project"
          arguments:
            - value: "<name>"
              hint_only: true
              description: "Project name"
        use:
          description: "Activate an existing project"
          arguments:
            - value: "<name-or-id>"
              hint_only: true
              description: "Project name, slug, or id"
        current:
          description: "Show the active project"
          closes: true
        clear:
          description: "Clear the active project"
          closes: true
        archive:
          description: "Archive a project"
          arguments:
            - value: "<name-or-id>"
              hint_only: true
              description: "Project name, slug, or id"
        unarchive:
          description: "Unarchive a project"
          arguments:
            - value: "<name-or-id>"
              hint_only: true
              description: "Project name, slug, or id"
        delete:
          description: "Delete a project"
          arguments:
            - value: "<name-or-id>"
              hint_only: true
              description: "Project name, slug, or id"
        link:
          description: "Link a run to the active project"
          subcommands:
            last:
              description: "Link the latest run"
              close_after:
                last: 0
            run:
              description: "Link a run"
              arguments:
                - value: "<run-id>"
                  hint_only: true
                  description: "Run id"
              close_after:
                run: 1
        unlink:
          description: "Unlink a run from the active project"
          subcommands:
            run:
              description: "Unlink a run"
              arguments:
                - value: "<run-id>"
                  hint_only: true
                  description: "Run id"
              close_after:
                run: 1
        target:
          description: "Manage active-project targets"
          subcommands:
            list:
              description: "List project targets"
              closes: true
            add:
              description: "Add a typed target"
              subcommands:
                domain:
                  description: "Add a domain target"
                  arguments:
                    - value: "<domain>"
                      hint_only: true
                      value_type: domain
                      description: "Domain value"
                  close_after:
                    domain: 1
                url:
                  description: "Add a URL target"
                  arguments:
                    - value: "<url>"
                      hint_only: true
                      value_type: url
                      description: "URL value"
                  close_after:
                    url: 1
                host:
                  description: "Add a host target"
                  arguments:
                    - value: "<host>"
                      hint_only: true
                      value_type: host
                      description: "Host value"
                  close_after:
                    host: 1
                ip:
                  description: "Add an IP target"
                  arguments:
                    - value: "<ip>"
                      hint_only: true
                      value_type: ip
                      description: "IP address"
                  close_after:
                    ip: 1
                cidr:
                  description: "Add a CIDR target"
                  arguments:
                    - value: "<cidr>"
                      hint_only: true
                      value_type: cidr
                      description: "CIDR range"
                  close_after:
                    cidr: 1
            quick-add:
              description: "Infer and add a target from text"
              arguments:
                - value: "<text-or-value>"
                  hint_only: true
                  description: "Text containing a URL, CIDR, IP, or domain"
            remove:
              description: "Remove a target"
              arguments:
                - value: "<id-or-value>"
                  hint_only: true
                  description: "Target id or value"
  - root: quit
    description: "built-in: close the current tab"
    autocomplete:
      arguments: []
  - root: retention
    description: "built-in: show retention and persisted-output settings"
    autocomplete:
      arguments: []
  - root: rm
    description: "built-in: remove a session file after confirmation"
    feature_required: workspace
    autocomplete:
      flags:
        - value: -r
          description: "Remove folders recursively"
        - value: -f
          description: "Force-style flag; confirmation is still required"
        - value: -rf
          description: "Remove folders recursively"
      argument_limit: 1
      arguments: []
  - root: route
    description: "built-in: show the shell routing table summary"
    autocomplete:
      arguments: []
  - root: runs
    description: >-
      built-in: show active runs; use -v for details or --json for automation
    autocomplete:
      flags:
        - value: -v
          description: "Show full IDs, started timestamps, and metadata source"
        - value: --verbose
          description: "Show full IDs, started timestamps, and metadata source"
        - value: --json
          description: "Print active-run metadata as JSON"
  - root: secret
    description: "built-in: manage encrypted session secrets"
    autocomplete:
      subcommands:
        - value: set
          description: "Store or replace an encrypted secret through the browser prompt"
          takes_value: true
          insert: "set "
          value_hint:
            value: "<NAME>"
            hint_only: true
            description: "Environment-style secret name"
        - value: list
          description: "List stored secret names without values"
          closes: true
        - value: unset
          description: "Remove a stored secret"
          takes_value: true
          insert: "unset "
          value_hint:
            value: "<NAME>"
            hint_only: true
            description: "Environment-style secret name"
        - value: show-consumers
          description: "Show command registry env vars that consume secrets"
          closes: true
  - root: session-token
    description: "built-in: show or manage persistent session tokens"
    autocomplete:
      subcommands:
        - value: generate
          description: >-
            Generate a new session token and save it to this browser
          closes: true
        - value: set
          description: "Activate an existing session token from another device"
          takes_value: true
          insert: "set "
          value_hint:
            value: "<token>"
            hint_only: true
            description: "Paste a tok_... token or UUID from another device"
        - value: copy
          description: "Copy the active session token to the clipboard"
          closes: true
        - value: clear
          description: "Confirm before removing the active session token"
          closes: true
        - value: rotate
          description: "Generate a new token and migrate all history to it"
          closes: true
        - value: list
          description: "Show the active session token and its creation date"
          closes: true
        - value: revoke
          description: "Permanently invalidate a tok_ token on this server"
          takes_value: true
          insert: "revoke "
          value_hint:
            value: "<token>"
            hint_only: true
            description: "tok_ token to permanently invalidate on the server"
  - root: shortcuts
    description: "built-in: show current keyboard shortcuts"
    autocomplete:
      arguments: []
  - root: stats
    description: "built-in: show session activity totals and command breakdowns"
    autocomplete:
      arguments: []
  - root: sort
    description: "built-in: sort a session file"
    feature_required: workspace
    autocomplete:
      flags:
        - value: -r
          description: "Reverse sort"
        - value: -n
          description: "Numeric sort"
        - value: -u
          description: "Unique lines"
      argument_limit: 1
      arguments: []
  - root: status
    description: >-
      built-in: show the current session summary, limits, and backend health
    autocomplete:
      arguments: []
  - root: tail
    description: "built-in: print the last lines of a session file"
    feature_required: workspace
    autocomplete:
      flags:
        - value: -n
          description: "Line count"
          takes_value: true
          suggest:
            - value: "10"
              description: "Ten lines"
      argument_limit: 1
      arguments: []
  - root: theme
    description: "built-in: show or apply the active shell theme"
    autocomplete:
      subcommands:
        - value: list
          description: "Show available themes"
          closes: true
        - value: current
          description: "Show the active theme"
          closes: true
        - value: set
          description: "Apply a theme"
          takes_value: true
          insert: "set "
  - root: tour
    description: "built-in: print the onboarding tour inside the terminal"
    feature_required: tour
    autocomplete:
      subcommands:
        - value: help
          description: "Show tour command usage"
          closes: true
  - root: tty
    description: "built-in: show the web terminal device path"
    autocomplete:
      arguments: []
  - root: type
    description: >-
      built-in: describe whether a command is built-in, installed, or missing
    autocomplete:
      argument_limit: 1
      arguments: []
  - root: uname
    description: "built-in: show the shell platform string"
    autocomplete:
      flags:
        - value: -a
          description: "All system information"
  - root: uptime
    description: "built-in: show app uptime since process start"
    autocomplete:
      arguments: []
  - root: uniq
    description: "built-in: collapse adjacent duplicate lines in a session file"
    feature_required: workspace
    autocomplete:
      flags:
        - value: -c
          description: "Prefix lines by duplicate count"
      argument_limit: 1
      arguments: []
  - root: var
    description: "built-in: set, list, or unset session command variables"
    autocomplete:
      close_after:
        list: 0
        set: 2
        unset: 1
      subcommands:
        - value: list
          description: "Show session variables"
          closes: true
        - value: set
          description: "Set a session variable"
          takes_value: true
          insert: "set "
        - value: unset
          description: "Remove a session variable"
          takes_value: true
          insert: "unset "
  - root: version
    description: >-
      built-in: show shell, app, Flask, and Python version details
    autocomplete:
      arguments: []
  - root: which
    description: >-
      built-in: locate a built-in command or allowed runtime command
    autocomplete:
      argument_limit: 1
      arguments: []
  - root: wordlist
    description: "built-in: list and search installed SecLists wordlists"
    autocomplete:
      subcommands:
        - value: list
          description: "List curated wordlists"
          takes_value: true
          insert: "list "
          value_hint:
            value: "<category>"
            hint_only: true
            description: "Wordlist category"
        - value: search
          description: "Search curated wordlists"
          takes_value: true
          insert: "search "
          value_hint:
            value: "<term>"
            hint_only: true
            description: "Search term"
        - value: path
          description: "Print one wordlist path"
          takes_value: true
          insert: "path "
          value_hint:
            value: "<name>"
            hint_only: true
            description: "Wordlist name or relative path"
      flags:
        - value: --all
          description: "List every installed SecLists file"
  - root: workflow
    description: "built-in: list, inspect, and run guided workflows"
    autocomplete:
      subcommands:
        - value: list
          description: "List workflows"
          closes: true
        - value: show
          description: "Show workflow steps"
          takes_value: true
          insert: "show "
          value_hint:
            value: "<workflow>"
            hint_only: true
            description: "Workflow name"
        - value: run
          description: "Run a workflow"
          takes_value: true
          insert: "run "
          value_hint:
            value: "<workflow>"
            hint_only: true
            description: "Workflow name"
  - root: who
    description: "built-in: show the current shell user and session"
    autocomplete:
      arguments: []
  - root: whoami
    description: "built-in: describe this shell and link to the project README"
    autocomplete:
      arguments: []
  - root: wc
    description: "built-in: count lines in a session file"
    feature_required: workspace
    autocomplete:
      flags:
        - value: -l
          description: "Count lines"
          takes_value: true
          value_hint:
            value: "<file>"
            hint_only: true
            description: "Session file"
