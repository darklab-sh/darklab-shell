#   AlienVault OTX indicator: 21600 (6h)
#   AbuseIPDB IP: 21600 (6h)
#   IPinfo IP: 21600 (6h)
#   Team Cymru IP: 86400 (24h)
#   crt.sh domain: 86400 (24h)
