# darklab_shell — Configuration
# ----------------------------------
# Changes to this file take effect after a container restart (docker compose restart).
# No rebuild is needed.
# Optional: add sibling *.local.* files for untracked server-specific overrides.
# Examples: app/conf/config.local.yaml, app/conf/commands.local.yaml,
# app/conf/ascii.local.txt,
# app/conf/app_hints.local.txt, app/conf/faq.local.yaml,
# app/conf/welcome.local.yaml, app/conf/themes/<name>.local.yaml.
# If present, each local overlay is applied after its checked-in base file.
# Text/config lists append local entries; ASCII art files use the local file if
# present; YAML config dictionaries merge key-by-key.

# ── Branding ──────────────────────────────────────────────────────────────────

# Name displayed in the browser tab, header, and permalink pages.
# Values longer than 20 visible characters are shortened at startup.
# Server default if unset: "darklab_shell"
# app_name: "darklab_shell"

# Prompt identity shown at the start of the terminal prompt and welcome samples.
# The UI renders "<username>@<domain>:~ $" when workspaces are disabled and
# "<username>@<domain>:<workspace path> $" when workspaces are enabled.
# Server defaults if unset: "anon" and "darklab.sh"
# prompt_username: "anon"
# prompt_domain: "darklab.sh"

# Optional message shown at the top of the terminal on page load.
# Leave empty to disable.
# Server default if unset: ""
# motd: ""

# ── Appearance ────────────────────────────────────────────────────────────────

# Default color theme filename. Should match a file under app/conf/themes/.
# If unset or invalid, the built-in fallback palette is used.
# default_theme: darklab_obsidian.yaml

# ── History & Retention ───────────────────────────────────────────────────────

# Number of runs shown in the history drawer per session (UI display limit only —
# the database always stores everything until purged by the retention policy below)
# Server default if unset: 50
# history_panel_limit: 50

# Number of recent commands surfaced in the Recent row
# (desktop rail chips; mobile peek row and pull-up recents sheet)
# Server default if unset: 50
# recent_commands_limit: 50

# Directory used for SQLite history, compressed full-output artifacts, body-store
# files, and the app-owned secret key file. Postgres deployments still use this
# directory for filesystem artifacts and offloaded body-store files.
# Leave unset for auto-detect: use /data when it is writable, otherwise fall
# back to /tmp for local/dev runs. If set explicitly, startup requires the
# directory to be writable.
# Server default if unset: auto (/data if writable, otherwise /tmp)
# data_dir: /data
#
# Database backend. SQLite is the default for local and single-user installs.
# Set this to postgres to use database_url, the Postgres connection pool, and
# app-owned Postgres migrations at startup.
# Server default if unset: sqlite
# database_backend: sqlite
#
# Postgres DSN and pool bounds. These are ignored while database_backend is
# sqlite. DATABASE_URL, DATABASE_POOL_MIN, and DATABASE_POOL_MAX environment
# variables can also set these values for Compose-based deployments.
# Server defaults if unset: "", 1, 5
# database_url: postgresql://darklab:darklab_dev_password@postgres:5432/darklab_shell
# database_pool_min: 1
# database_pool_max: 5
#
# Postgres JIT can make interactive page requests slower when a complex query
# crosses Postgres' cost threshold. The app disables JIT on pooled connections
# by default; set this to true only if your workload benefits from JIT.
# Server default if unset: false
# database_postgres_jit: false

# Enable the built-in basic redaction model for snapshot sharing. When enabled,
# the app applies a
# conservative built-in baseline before any operator-defined rules:
#   - bearer tokens / Authorization: Bearer ...
#   - email addresses
#   - IPv4 addresses
#   - IPv6 addresses
#   - hostnames / dotted domains
# The app then appends any operator-defined rules from `share_redaction_rules`.
# Normal run history, history permalinks, and local `save txt` / `save html` /
# `save pdf` exports remain raw.
# Server default if unset: true
# share_redaction_enabled: true
#
# Optional operator-defined regex rules appended after the built-in snapshot-share
# redaction rules.
# Each rule supports:
#   label:       optional human-readable name
#   pattern:     required regular expression
#   replacement: replacement text (default: [redacted])
#   flags:       optional regex flags from: i, m
# Server default if unset: []
# share_redaction_rules:
#   - label: bearer token
#     pattern: 'Bearer\s+\S+'
#     replacement: 'Bearer [redacted]'
#     flags: i
#   - label: ipv4
#     pattern: '\b\d{1,3}(?:\.\d{1,3}){3}\b'
#     replacement: '[ip-redacted]'

# Permalink retention in days. Runs and snapshots older than this will be
# deleted from the database on startup. Set to 0 for unlimited retention.
# Server default if unset: 365
# permalink_retention_days: 365

# Optional filesystem offload thresholds for large text bodies stored under
# data_dir/body-store. Set to 0 to keep the current all-inline database shape.
# Values accept bytes or strings like 512kb / 2mb.
# Server defaults if unset: 0
# runs_search_text_inline_max_bytes: 0
# snapshots_inline_max_bytes: 0
# intel_payload_inline_max_bytes: 0

# ── Per-session Workspace Storage ────────────────────────────────────────────
#
# Optional app-mediated file storage for file-enabled commands and UI.
# helpers. This does not enable shell navigation or redirection by itself.
# Server default if unset: false
# workspace_enabled: false
#
# Storage backend label. `tmpfs` is intended for short-lived in-memory storage;
# `volume` is intended for a Docker-mounted bind mount or named volume.
# The backend value documents operator intent; `workspace_root` controls the
# actual filesystem location and does not create a Docker mount by itself.
# Server default if unset: tmpfs
# workspace_backend: tmpfs
#
# Root directory that will contain hashed per-session workspace directories.
# Never point this at the app source tree, SQLite data directory, or host root.
# Session directories are created sticky + setgid, and files are group-readable
# for the app/scanner shared group without being world-readable.
# The Docker entrypoint normalizes WORKSPACE_ROOT ownership and permissions
# before dropping to appuser. In Compose deployments, set WORKSPACE_ROOT in
# docker-compose.yml, a Compose override, or .env; the app treats that env var as
# the runtime workspace_root override so the path only needs to live in one place.
# Server default if unset: /tmp/darklab_shell-workspaces
# workspace_root: /tmp/darklab_shell-workspaces
#
# Per-session byte quota expressed in megabytes.
# Server default if unset: 50
# workspace_quota_mb: 50
#
# Maximum size for a single app-mediated text file in megabytes.
# Server default if unset: 5
# workspace_max_file_mb: 5
#
# Maximum number of files in one session workspace.
# Server default if unset: 100
# workspace_max_files: 100
#
# Remove inactive session workspaces after this many hours. Set to 0 to disable
# age-based cleanup, though quotas still apply.
# Server default if unset: 1
# workspace_inactivity_ttl_hours: 1

# ── Project Workspace Guardrails ─────────────────────────────────────────────
#
# Per-session and per-project caps for project workspace records. Set to 0 for
# unlimited, though route rate limits still apply.
# Server default if unset: 100
# max_projects_per_session: 100
#
# Server default if unset: 5000
# max_project_links_per_project: 5000
#
# Maximum Atlas entities linked into one project. Set to 0 for unlimited,
# though max_project_links_per_project still applies.
# Server default if unset: 5000
# max_project_entities_per_project: 5000
#
# Maximum manual or discovered project targets. Bulk-linked Atlas entities use
# max_project_entities_per_project instead.
# Server default if unset: 200
# max_project_targets_per_project: 200
#
# Server default if unset: 25
# max_evidence_packages_per_project: 25
#
# Server default if unset: 5000
# max_entity_labels_per_session: 5000
#
# Server default if unset: 20
# max_entity_labels_per_entity: 20
#
# Server default if unset: 2000
# max_entity_notes_per_session: 2000
#
# Evidence package final ZIP size cap in megabytes. Set to 0 for unlimited.
# Server default if unset: 25
# evidence_package_max_mb: 25
#
# Evidence package expanded-content cap before ZIP compression, in megabytes.
# Set to 0 for unlimited.
# Server default if unset: 500
# evidence_package_max_uncompressed_mb: 500
#
# Maximum number of workspace artifacts included in one evidence package. Set
# to 0 for unlimited.
# Server default if unset: 100
# evidence_package_max_artifacts: 100
#
# Evidence package download/build rate limits use the shared limiter and are
# tighter than normal command/project writes because archive construction can
# read many workspace files.
# Server default if unset: 10
# evidence_package_download_rate_limit_per_minute: 10
#
# Server default if unset: 2
# evidence_package_download_rate_limit_per_second: 2

# ── Outbound Notifications ───────────────────────────────────────────────────
#
# Server-side delivery guardrails for outbound notification channels. Channel
# CRUD and concrete channel senders are built on this storage/worker foundation.
# Server default if unset:
# notifications:
#   do_not_disturb: false
#   delivery_rate_per_minute: 10
#   http_timeout_seconds: 8
#   test_timeout_seconds: 4
#   http_private_host_allowlist: []  # Exact hosts, IPs, or CIDR ranges allowed for private webhook targets.
#   smtp:
#     host: ""
#     port: 587
#     user: ""
#     password_secret_id: ""  # Environment variable name holding the SMTP password.
#     from_address: ""
#     tls: starttls  # starttls, ssl, or none
#   retry:
#     max_attempts: 6
#     max_age_hours: 24
#     base_delay_seconds: 30
#   events:
#     retention_days: 30

# ── Scheduler ────────────────────────────────────────────────────────────────
#
# Server-side cadence settings for scheduled runs and watcher-owned schedules.
# The scheduler worker is a separate process from Gunicorn and uses a database
# or filesystem lock so only one worker fires due schedules.
# Server default if unset:
# scheduler:
#   lock_path: ""  # Empty uses APP_DATA_DIR/scheduler.lock for SQLite.
#   tick_seconds: 5
#   max_per_session: 32
#   missed_fire_policy: coalesce
#   max_catchup_window_seconds: 3600
#   default_timezone: UTC

# ── Watchers ────────────────────────────────────────────────────────────────
#
# Server-side limits for change-detection monitors. Each watcher owns one
# scheduler row, so this cap bounds both watcher state and recurring checks.
# Server default if unset:
# watchers:
#   max_per_session: 32

# ── Logging ───────────────────────────────────────────────────────────────────

# Log verbosity level . Options: ERROR, WARN, INFO, DEBUG
# ERROR — application errors only (spawn failures, health check failures, stream errors)
# WARN  — errors plus warnings: denied commands, rate limit hits, command timeouts
# INFO  — warnings plus operational events: run start/end/kill with client IP (default)
# DEBUG — everything: every HTTP request/response, command rewrites, share creation, kill misses
# Server default if unset: INFO
# log_level: INFO

# Log output format. Options: text, gelf
# text — human-readable key=value lines, suitable for Docker stdout / local dev
# gelf — newline-delimited GELF 1.1 JSON for Graylog / GELF-compatible back-ends
#         short_message contains the event name; all context is in _-prefixed fields
# Server default if unset: text
# log_format: text

# ── Trusted Proxies ──────────────────────────────────────────────────────────

# IPs or CIDR ranges that are allowed to supply X-Forwarded-For values.
# Requests from outside these ranges ignore forwarded headers and use the
# direct connection IP instead. The default keeps loopback trusted for local
# development and tests; production should list the actual reverse proxy subnet
# here if it is not already covered.
# trusted_proxy_cidrs:
#   - 127.0.0.1/32
#   - ::1/128

# ── Operator Diagnostics ─────────────────────────────────────────────────────
#
# GET /diag returns a JSON summary of app version, operational config, database
# health and row counts, Redis connectivity, vendor-asset source (built-in vs
# fallback), and per-tool availability derived from the allowlist.
#
# The endpoint returns 404 to all callers unless the resolved client IP falls
# within one of the CIDRs listed here. Client IP resolution uses the same
# trusted-proxy rules as the rest of the app: X-Forwarded-For is only honored
# when the direct peer IP is inside trusted_proxy_cidrs. Leave the list empty
# (the default) to keep the endpoint fully hidden.
#
# Typical values:
#   172.16.0.0/12  — Docker bridge / overlay networks (recommended for host access)
#   10.0.0.0/8     — private LAN / VPN range
#
# If you are behind a reverse proxy, also make sure trusted_proxy_cidrs covers
# that proxy address/range; otherwise forwarded client IPs are ignored and the
# proxy peer IP is used instead.
#
# Server default if unset: [] (disabled)
# diagnostics_allowed_cidrs:
#   - 172.16.0.0/12
#
# GET /metrics exposes Prometheus-format metrics for dashboards and alerts.
# It uses the same IP allowlist as /diag and returns 404 when the caller is not
# allowed. Keep diagnostics_allowed_cidrs empty to hide both endpoints.
# AI assist writes from this allowlist also bypass the per-session AI quota for
# operator testing. The deployment-wide AI quota and worker concurrency still
# apply, so trusted clients cannot overload a local model.
#
# Server default if unset: true
# metrics_enabled: true
#
# Shared directory used by prometheus_client to aggregate counters/histograms
# across Gunicorn workers. In the Docker Compose setup this lives on /tmp tmpfs
# and is cleared on container startup by entrypoint.sh.
# Server default if unset: /tmp/darklab_shell-prom
# prometheus_multiproc_dir: /tmp/darklab_shell-prom
#
# Optional histogram bucket overrides, in seconds. The defaults cover short
# web requests and long-running scanner commands.
# metrics_histogram_buckets_run_duration:
#   - 0.1
#   - 0.5
#   - 1
#   - 2
#   - 5
#   - 10
#   - 30
#   - 60
#   - 300
#   - 900
#   - 1800
#   - 3600
# metrics_histogram_buckets_http_duration:
#   - 0.005
#   - 0.01
#   - 0.05
#   - 0.1
#   - 0.5
#   - 1
#   - 5
# metrics_histogram_buckets_ai_provider_duration:
#   - 0.1
#   - 0.5
#   - 1
#   - 2
#   - 5
#   - 10
#   - 30
#   - 60

# ── AI Assists ───────────────────────────────────────────────────────────────
#
# Optional AI provider settings for run-output summaries and safe next-command
# drafts. The foundation is disabled by default. Provider calls use an
# OpenAI-compatible /v1/chat/completions endpoint, and the diagnostics page can
# probe /v1/models plus run a tiny JSON-only test prompt when enabled.
# Server defaults if unset:
# ai_enabled: false
# ai_provider: openai_compatible
# ai_base_url: ""
# ai_model: ""
# ai_api_key_secret_name: ""  # Existing session vault secret name, when the caller has a session.
# ai_api_key: ""              # Environment/config fallback for operators that prefer process env.
# ai_connect_timeout_seconds: 5
# ai_timeout_seconds: 120
# ai_max_input_chars: 24000
# ai_max_output_tokens: 120
# ai_next_commands_max_output_tokens: 180
# ai_max_concurrent: 1
# ai_max_queue_depth: 20
# diagnostics_allowed_cidrs clients bypass this per-session AI write limit only.
# The global AI write limit below still applies to every client.
# ai_rate_limit_per_session_hour: 5
# ai_rate_limit_global_per_minute: 2
# ai_allow_full_output: false
# ai_require_private_base_url: true
# ai_base_url_allowed_cidrs: []
# ai_prompt_version_override: ""
# ai_feature_summary: false
# ai_feature_next_commands: false
# ai_feature_run_suggestions: false

# ── Restricted Command Inputs ────────────────────────────────────────────────

# IPs or CIDR ranges that should be rejected when supplied as command targets.
# This applies only to command slots explicitly marked with host/domain/IP/CIDR
# value metadata in commands.yaml, including inspectable workspace input files
# passed through declared read flags. Domain names are not DNS-resolved here;
# this policy blocks literal IP/CIDR values and literal IPs embedded in URLs or
# host:port values.
#
# Typical values:
#   169.254.169.254/32 — cloud metadata service
#   127.0.0.0/8        — IPv4 loopback range
#   ::1/128            — IPv6 loopback address
#
# Server default if unset: [] (disabled)
# restricted_command_input_cidrs:
#   - 169.254.169.254/32

# ── Rate Limiting ─────────────────────────────────────────────────────────────

# Whether the shared /runs and /api/v1 rate limiter is active at all. Set to false
# for test-only or maintenance overlays where you want the app to accept requests
# without throttling.
# Server default if unset: true
# rate_limit_enabled: true

# Maximum number of /runs and /api/v1 requests per minute per IP
# Server default if unset: 30
# rate_limit_per_minute: 30

# Maximum number of /runs and /api/v1 requests per second per IP
# Server default if unset: 5
# rate_limit_per_second: 5

