# Maximum number of interactive PTY input requests per second per IP.
# Server default if unset: 10
# interactive_pty_input_rate_limit_per_second: 10

# ── Terminal ──────────────────────────────────────────────────────────────────

# Maximum number of tabs a user can have open at once.
# Set to 0 for unlimited.
# Server default if unset: 8
# max_tabs: 8

# Maximum number of output lines retained per tab. Older lines are dropped
# from the top to prevent the browser slowing down on verbose commands.
# Set to 0 for unlimited.
# Server default if unset: 5000
# max_output_lines: 5000

# Pause live DOM rendering for brokered command output after this many received
# lines. The run keeps counting output, kill controls stay active, and saved
# previews/full-output artifacts still follow max_output_lines,
# output_preview_max_mb, persist_full_run_output, and full_output_max_mb.
# Set to 0 to disable the high-volume live-output pause.
# Server default if unset: 50000
# high_volume_output_line_threshold: 50000

# While high-volume live-output mode is active, show a fresh status line after
# this many additional received lines.
# Server default if unset: 50000
# high_volume_output_status_interval_lines: 50000

# Hard cap for the saved run preview payload, expressed in megabytes.
# This protects history reads from huge single-line outputs such as JSON.
# Set to 0 for unlimited.
# Server default if unset: 1 MB
# output_preview_max_mb: 1MB

# Persist the full output of completed runs as compressed artifact files under /data.
# The history drawer and normal run permalink continue to use the capped preview stored
# in the configured database; this enables a separate "view full output" page for completed runs.
# Server default if unset: true
# persist_full_run_output: true

# Hard cap for persisted full-output artifacts, expressed in megabytes.
# The app multiplies this value by 1024*1024 internally. Set to 0 for unlimited.
# If the artifact reaches this limit, the full-output page remains available but
# includes a truncation notice.
# Server default if unset: 5 MB
# full_output_max_mb: 5MB

# Automatically kill a running command after this many seconds.
# Set to 0 to disable (commands run until they finish or are killed manually).
# Server default if unset: 3600
# command_timeout_seconds: 3600

# How often (in seconds) to send a heartbeat comment on idle SSE connections
# to prevent nginx and the browser from dropping the connection.
# Server default if unset: 20
# heartbeat_interval_seconds: 20

# ── Run Broker ────────────────────────────────────────────────────────────────

# Enable the Redis-backed run broker that lets command output be replayed and
# reattached independently of the HTTP request that started the command.
# Server default if unset: true
# run_broker_enabled: true

# Require Redis when the run broker is enabled. Production Docker deployments
# should keep this enabled; local single-process development can set this to
# false for a limited in-memory fallback.
# Server default if unset: true
# run_broker_require_redis: true

# Safety TTL for active broker streams, refreshed while the run is active.
# Server default if unset: 14400
# run_broker_active_stream_ttl_seconds: 14400

# TTL for completed broker streams after history finalization. Completed run
# restore falls back to saved history rows and artifacts after this window.
# Server default if unset: 3600
# run_broker_completed_stream_ttl_seconds: 3600

# Maximum replay payload retained per run stream, in bytes. Line replay is also
# bounded by max_output_lines; there is no separate run_broker_max_replay_lines.
# Server default if unset: 10485760
# run_broker_max_replay_bytes: 10485760

# How long stream subscribers block waiting for new events before the server
# emits a heartbeat and checks again.
# Server default if unset: 15
# run_broker_subscriber_block_seconds: 15

# How often broker workers emit heartbeat events while a process is idle.
# Server default if unset: 20
# run_broker_heartbeat_seconds: 20

# How long an origin browser can go without touching a run before that origin
# is considered stale and another browser can reconnect/restore it.
# Server default if unset: 75
# run_broker_owner_stale_seconds: 75

# Enable interactive PTY mode for allowlisted interactive tools such as
# nc --interactive, telnet --interactive, mtr --interactive, ffuf --interactive,
# and masscan --interactive. Multi-worker deployments require Redis so PTY
# output, input, and resize events can be brokered across workers. Without
# Redis, this mode is limited to single-worker local/dev deployments.
# Server default if unset: false
# interactive_pty_enabled: false

# Maximum lifetime for an interactive PTY command before the server terminates
# it, in seconds.
# Server default if unset: 900
# interactive_pty_max_runtime_seconds: 900

# Maximum number of active interactive PTY runs allowed for one browser session.
# Server default if unset: 4
# interactive_pty_max_concurrent_per_session: 4

# Maximum number of recent PTY events retained in local single-worker mode.
# Server default if unset: 512
# interactive_pty_buffer_limit: 512

# Maximum UTF-8 bytes accepted in one interactive PTY input/control event.
# Server default if unset: 4096
# interactive_pty_input_max_bytes: 4096

# How often an idle local PTY stream emits a heartbeat, in seconds.
# Server default if unset: 15
# interactive_pty_heartbeat_seconds: 15

# How often a PTY reader checks queued input/resize control events, in seconds.
# Server default if unset: 0.2
# interactive_pty_control_poll_seconds: 0.2

# Maximum Redis PTY events read per stream poll.
# Server default if unset: 100
# interactive_pty_stream_fetch_count: 100

# Approximate maximum Redis PTY stream length per active run.
# Server default if unset: 5000
# interactive_pty_stream_maxlen: 5000

# PTY snapshot publish thresholds. Larger byte/second values reduce Redis
# writes; smaller values make cross-worker reattach snapshots fresher.
# Server defaults if unset: 8192 bytes, 1 second, minimum 0.2 seconds.
# interactive_pty_snapshot_publish_bytes: 8192
# interactive_pty_snapshot_publish_seconds: 1
# interactive_pty_snapshot_min_publish_seconds: 0.2

# Maximum plain fallback entries returned when an ANSI PTY snapshot is not
# available.
# Server default if unset: 200
# interactive_pty_snapshot_fallback_entry_limit: 200

# ── Welcome Animation ─────────────────────────────────────────────────────────

# Base delay between each typed character in the welcome animation (milliseconds).
# Lower values make the typing appear faster.
# Server default if unset: 18
# welcome_char_ms: 18

# Random jitter added on top of welcome_char_ms per character (milliseconds).
# Adds a human feel — each character takes between welcome_char_ms and
# welcome_char_ms + welcome_jitter_ms. Set to 0 for perfectly even typing.
# Server default if unset: 12
# welcome_jitter_ms: 12

# How long the welcome animation pauses after a command finishes typing,
# before the next visual step begins (milliseconds).
# This affects each sampled welcome command.
# Lower values make the intro feel snappier; higher values make it feel more theatrical.
# Server default if unset: 650
# welcome_post_cmd_ms: 650

# How long the welcome animation waits between one sampled command block
# finishing and the next sampled command starting to type (milliseconds).
# This is the main "breathing room" between sampled command examples.
# Server default if unset: 850
# welcome_inter_block_ms: 850

# How long the very first shell prompt sits idle before the featured command
# starts typing (milliseconds).
# Increase this if you want the boot phase to land on a visible ready prompt
# with a few cursor blinks before the first example begins.
# Server default if unset: 1500
# welcome_first_prompt_idle_ms: 1500

# Extra pause after the fake startup-status block finishes and before the first
# sampled command prompt appears (milliseconds).
# This creates a clearer handoff from "boot complete" into the example phase.
# Server default if unset: 500
# welcome_post_status_pause_ms: 500

# How many sampled command examples to show after the ASCII/status intro.
# Lower values shorten the welcome sequence. Set to 0 to skip sampled commands.
# Server default if unset: 5
# welcome_sample_count: 5

# Labels shown in the fake startup-status block during the welcome animation.
# Keep this short and stylized — 4 to 6 uppercase labels reads best.
# Server default if unset:
#   - CONFIG
#   - RUNNER
#   - HISTORY
#   - LIMITS
#   - AUTOCOMPLETE
# welcome_status_labels:
#   - CONFIG
#   - RUNNER
#   - HISTORY
#   - LIMITS
#   - AUTOCOMPLETE

# How often the footer app hints rotate while the welcome tab remains idle (milliseconds).
# Higher values make the hints feel calmer; lower values make them feel more animated.
# Server default if unset: 4200
# welcome_hint_interval_ms: 4200

# Maximum number of hint states shown while the welcome tab remains idle.
# Set to 0 to keep rotating until interrupted.
# Set to 1 to keep only the first hint visible with no rotation.
# Higher values allow that many total hint states, counting the first hint.
# Server default if unset: 0
# welcome_hint_rotations: 0

# Enable the app tour entry points. When disabled, the welcome tour prompt,
# visual tour links, and `tour` built-in command are hidden.
# Server default if unset: true
# tour_enabled: true
