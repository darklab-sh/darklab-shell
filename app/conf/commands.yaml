    runtime_adaptations:
      inject_flags:
        - flags:
            - -ud
            - /tmp/nuclei-templates
          position: prepend
          unless_any:
            - -ud
        - flags:
            - env
            - XDG_CONFIG_HOME={session_workspace}/tools
          position: command_prefix
          requires_workspace: true
    autocomplete:
      examples:
        - value: nuclei -h
          description: Show help and usage
        - value: nuclei -u https://ip.darklab.sh -t http/
          description: Run HTTP detection templates
        - value: nuclei -u https://ip.darklab.sh -severity high,critical
          description: Run only high and critical severity templates
        - value: nuclei -u https://ip.darklab.sh -t ssl/
          description: Run TLS/SSL detection templates
        - value: nuclei -l urls.txt -severity high,critical -o nuclei-findings.txt
          description: Scan URLs from a session file and save findings
          feature_required: workspace
        - value: nuclei -u https://ip.darklab.sh -sresp -srd nuclei-responses
          description: Store raw request/response evidence in a session directory
          feature_required: workspace
        - value: nuclei -u https://ip.darklab.sh -me nuclei-markdown
          description: Export findings as Markdown files in a session directory
          feature_required: workspace
      flags:
        - value: -h
          description: Show help and usage
          closes: true
        - value: -u
          description: Single target URL
          takes_value: true
          value_hint:
            placeholder: <url>
            hint_only: true
            value_type: url
            description: Target URL to scan
        - value: -l
          description: File with targets
          takes_value: true
          feature_required: workspace
          value_hint:
            placeholder: <target-file>
            hint_only: true
            value_type: target
            description: Session file containing one URL or host per line
          suggest:
            - value: urls.txt
              description: Session file containing one URL per line
        - value: -t
          description: Template or template directory
          takes_value: true
        - value: -severity
          description: Filter by severity
          takes_value: true
          suggest:
            - value: low,medium,high,critical
              description: Comma-separated severities
        - value: -tags
          description: Filter by tags
          takes_value: true
        - value: -rl
          description: Rate limit requests
          takes_value: true
        - value: -o
          description: Write findings to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-findings.txt
              description: Save nuclei findings
        - value: -sresp
          description: Store raw request/response evidence
        - value: -srd
          description: Store raw request/response evidence in a session directory
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-responses
              description: Store request/response evidence
        - value: -store-resp-dir
          description: Store raw request/response evidence in a session directory
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-responses
              description: Store request/response evidence
        - value: -me
          description: Export Markdown findings to a session directory
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-markdown
              description: Save Markdown finding reports
        - value: -se
          description: Export SARIF findings to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-results.sarif
              description: Save SARIF findings
        - value: -je
          description: Export JSON findings to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-results.json
              description: Save JSON findings
        - value: -jle
          description: Export JSONL findings to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-results.jsonl
              description: Save JSONL findings
        - value: -tlog
          description: Write request trace log to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-trace.log
              description: Save nuclei trace log
        - value: -elog
          description: Write request error log to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-errors.log
              description: Save nuclei error log
        - value: -config
          description: Read nuclei config from a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-config.yaml
              description: Session nuclei config file
        - value: -rc
          description: Read report integration config from a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: nuclei-report-config.yaml
              description: Session nuclei report config file
        - value: -sf
          description: Read authenticated-scan secrets from a session file
          takes_value: true
          feature_required: workspace
          suggest:
