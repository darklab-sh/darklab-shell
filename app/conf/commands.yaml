  - root: nmap
    description: Scans hosts for open ports, services, versions, and network characteristics.
    category: Vulnerability Scanning
    knowledge:
      notes:
        - Runs unprivileged, so a TCP connect scan (-sT) is injected when no scan type is given.
        - Output flags (-oN/-oX/-oG) and input flags (-iL/--script-args-file) are rewritten into the session workspace when Files are enabled.
      gotchas:
        - -sS, -O, and --privileged are denied because the container has no raw-socket access; use -sT for TCP connect scans.
      safe_defaults:
        - Use -sT for connect scans and add -Pn to skip host discovery on filtered hosts; scope ports with -p or --top-ports.
      common_flags:
        - "-sT — TCP connect scan"
        - "-sV — service/version detection"
        - "-Pn — skip host discovery"
        - "-p — ports to scan"
      artifact_behavior: With Files enabled, -oN/-oX/-oG/-o write report files into the session workspace and -iL/--script-args-file read from it; raw output paths are otherwise denied.
    help:
      flags:
        - -h
        - --help
    policy:
      allow:
        - nmap
      deny:
        - nmap -sS
        - nmap -O
        - nmap --privileged
        - nmap -o
        - nmap -oN
        - nmap -oX
        - nmap -oG
        - nmap -oA
        - nmap -oS
        - nmap --output
        - nmap -iL
        - nmap --script-args-file
