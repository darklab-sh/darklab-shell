  - root: ffuf
    description: Fuzzes web requests with wordlists to discover paths, parameters, hosts, or other inputs.
    category: Network Reconnaissance
    knowledge:
      notes:
        - Place the FUZZ keyword in the -u URL (or a header) to mark the injection point; -w supplies the wordlist.
        - -w reads and -o/--output writes JSON through the session workspace when Files are enabled; use --interactive for the live PTY view.
      gotchas:
        - The live progress line is terminal-only and noisy; capture results with -o JSON (Files) or run --interactive.
      safe_defaults:
        - Scope matches with -mc (match codes) or -fc (filter codes) so the wordlist does not flood the transcript.
      common_flags:
        - "-u — target URL with FUZZ marker"
        - "-w — wordlist path"
        - "-mc — match status codes"
        - "-fc — filter status codes"
      artifact_behavior: With Files enabled, -o/--output writes JSON results into the session workspace and -w reads wordlists from it or packaged seclists; bare -o paths are denied.
    help:
      flags:
        - -h
        - --help
    policy:
      allow:
        - ffuf
      deny:
        - ffuf -o
        - ffuf --output
        - ffuf --interactive
    interactive:
      mode: pty
      trigger_flag: --interactive
      default_rows: 30
      default_cols: 120
      max_runtime_seconds: 900
      allow_input: true
      input_safety: scanner_controls
      requires_args: true
      transcript_mode: scrollback_findings
    workspace_flags:
      - flag: -w
        mode: read
        value: separate
        format: text
      - flag: -o
        mode: write
        value: separate
        format: json
      - flag: --output
        mode: write
        value: separate_or_attached
        format: json
    autocomplete:
      examples:
        - value: ffuf -h
          description: Show help and usage
        - value: ffuf -u https://ip.darklab.sh/FUZZ -w /usr/share/wordlists/seclists/Discovery/Web-Content/common.txt
          description: Directory brute force with common wordlist
        - value: ffuf --interactive -u https://ip.darklab.sh/FUZZ -w /usr/share/wordlists/seclists/Discovery/Web-Content/common.txt
          description: Run ffuf in the interactive PTY view
          interactive: true
        - value: ffuf -u https://ip.darklab.sh/FUZZ -w /usr/share/wordlists/seclists/Discovery/Web-Content/common.txt
            -mc 200,301,302
          description: Filter for successful and redirect responses
        - value: 'ffuf -u https://FUZZ.ip.darklab.sh -w /usr/share/wordlists/seclists/Discovery/DNS/subdomains-top1million-5000.txt
            -H "Host: FUZZ.ip.darklab.sh"'
          description: Virtual host brute force with Host header injection
        - value: ffuf -u https://ip.darklab.sh/FUZZ -w /usr/share/wordlists/seclists/Discovery/Web-Content/common.txt -o ffuf-results.json
          description: Save fuzzing results as JSON in session files
          feature_required: workspace
      flags:
        - value: -h
          description: Show help and usage
          takes_value: true
          closes: true
        - value: -u
          description: Target URL with FUZZ marker
          takes_value: true
          value_hint:
            placeholder: <url-with-FUZZ>
            hint_only: true
            value_type: url
            description: Target URL including FUZZ
        - value: -w
          description: Wordlist path
          takes_value: true
          value_type: wordlist
          wordlist_category:
            - web-content
            - api
            - fuzzing
            - dns
          suggest:
            - value: /usr/share/wordlists/seclists/Discovery/Web-Content/common.txt
              description: Common web-content wordlist
        - value: -mc
          description: Match status codes
          takes_value: true
        - value: -fc
          description: Filter status codes
          takes_value: true
        - value: -H
          description: Add request header
          takes_value: true
        - value: -t
          description: Concurrent threads
          takes_value: true
        - value: -o
          description: Write JSON results to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: ffuf-results.json
              description: Save machine-readable fuzzing results
        - value: --interactive
          description: Open the interactive terminal view
      arguments:
        - placeholder: <target-url>
          hint_only: true
          value_type: url
          description: Usually provided through -u
  - root: trufflehog
    description: Scans workspace folders or HTTPS Git repositories for exposed secrets.
    category: Vulnerability Scanning
    knowledge:
      notes:
        - Use filesystem --directory for a session folder, or git https://... for a remote repository scan.
        - JSON output is added automatically for managed scans so the app can classify and redact secret fields before storing output.
      gotchas:
        - Local file:// and ssh:// Git scans, clone-path overrides, and no-cleanup modes are blocked to keep scans inside managed paths.
        - The --config path is blocked because detector config can carry sensitive policy and verifier settings.
      safe_defaults:
        - Run trufflehog filesystem --directory <folder> --json for workspace files, or trufflehog git https://... --json for a public remote repository.
      common_flags:
        - "filesystem --directory — scan a session folder"
        - "git https://... — scan an HTTPS Git repository"
        - "--json — emit JSON rows"
        - "--include-paths/--exclude-paths — read path regexes from session files"
      artifact_behavior: TruffleHog writes findings to stdout. With Files enabled, --directory reads a session folder and include/exclude path regex files read from the session workspace; local Git file paths and custom clone directories are blocked.
    help:
      flags:
        - --help
        - -h
      subcommands:
        - help
    policy:
      allow:
        - trufflehog --help
        - trufflehog -h
        - trufflehog help
        - trufflehog filesystem --directory
        - trufflehog git
      deny:
        - trufflehog --config
        - trufflehog --profile
        - trufflehog filesystem --config
        - trufflehog filesystem --profile
        - trufflehog filesystem --include-paths
        - trufflehog filesystem --exclude-paths
        - trufflehog git --config
        - trufflehog git --profile
        - trufflehog git --include-paths
        - trufflehog git --exclude-paths
        - trufflehog git --clone-path
        - trufflehog git --no-cleanup
        - trufflehog git --trust-local-git-config
        - trufflehog git file://
        - trufflehog git ssh://
        - trufflehog github
        - trufflehog gitlab
        - trufflehog s3
        - trufflehog gcs
        - trufflehog syslog
        - trufflehog circleci
        - trufflehog docker
    workspace_flags:
      - flag: --directory
        mode: read
        value: separate_or_attached
        kind: directory
        subcommands:
          - filesystem
      - flag: --include-paths
        mode: read
        value: separate_or_attached
        format: text
        subcommands:
          - filesystem
          - git
      - flag: --exclude-paths
        mode: read
        value: separate_or_attached
        format: text
        subcommands:
          - filesystem
          - git
    runtime_adaptations:
      inject_flags:
        - flags:
            - --json
          position: append
          unless_any:
            - --json
            - --help
            - -h
            - help
    autocomplete:
