  - root: testssl
    description: Tests TLS services for protocol support, cipher choices, certificate issues, and known weaknesses.
    category: Vulnerability Scanning
    knowledge:
      notes:
        - All file-output flags (--jsonfile/--csvfile/--htmlfile/--logfile and -oJ/-oA/-oj/-oC) are rewritten into the session workspace when Files are enabled.
      gotchas:
        - A full scan is slow and verbose; --fast or --severity HIGH trims both runtime and output noise.
      safe_defaults:
        - Start with --fast and narrow findings with --severity; use --sneaky for quieter probing.
      common_flags:
        - "--fast — lighter scan profile"
        - "--severity — restrict findings by severity"
        - "--full — full test suite"
        - "--sneaky — slower, quieter checks"
      artifact_behavior: With Files enabled, --jsonfile/--csvfile/--htmlfile/--logfile and -oJ/-oA/-oj/-oC write reports into the session workspace; bare output paths are denied.
    help:
      flags:
        - --help
    policy:
      allow:
        - testssl
      deny:
        - testssl --logfile
        - testssl --jsonfile
        - testssl --csvfile
        - testssl --htmlfile
        - testssl -oJ
        - testssl -oA
        - testssl -oj
        - testssl -oC
    workspace_flags:
      - flag: --logfile
        mode: write
        value: separate_or_attached
        format: text
      - flag: --jsonfile
        mode: write
        value: separate_or_attached
        format: json
      - flag: --csvfile
        mode: write
        value: separate_or_attached
        format: text
      - flag: --htmlfile
        mode: write
        value: separate_or_attached
        format: html
      - flag: -oJ
        mode: write
        value: separate_or_attached
        format: json
      - flag: -oA
        mode: write
        value: separate_or_attached
        format: text
      - flag: -oj
        mode: write
        value: separate_or_attached
        format: json
      - flag: -oC
        mode: write
        value: separate_or_attached
        format: text
    autocomplete:
      examples:
        - value: testssl --help
          description: Show help and usage
        - value: testssl --fast https://ip.darklab.sh
          description: Quick, lightweight TLS scan
        - value: testssl --severity HIGH https://ip.darklab.sh
          description: Report only high-severity findings
        - value: testssl --heartbleed https://ip.darklab.sh
          description: Check for the Heartbleed vulnerability
        - value: testssl --fast --jsonfile testssl-results.json https://ip.darklab.sh
          description: Save testssl JSON findings to a session file
          feature_required: workspace
      flags:
        - value: --help
          description: Show help and usage
          closes: true
        - value: --fast
          description: Faster, lighter scan profile
        - value: --severity
          description: Restrict findings by severity
          takes_value: true
          suggest:
            - value: HIGH
              description: High-severity findings only
            - value: LOW
              description: Low-severity findings only
        - value: --full
          description: Full test suite
        - value: --sneaky
          description: Slower, quieter checks
        - value: -p
          description: Protocol checks only
        - value: --heartbleed
          description: Check for Heartbleed
        - value: --poodle
          description: Check for POODLE
        - value: --beast
          description: Check for BEAST
        - value: --logfile
          description: Write text log output to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: testssl-results.txt
              description: Save text TLS findings
        - value: --jsonfile
          description: Write JSON output to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: testssl-results.json
              description: Save JSON TLS findings
        - value: --csvfile
          description: Write CSV output to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: testssl-results.csv
              description: Save CSV TLS findings
        - value: --htmlfile
          description: Write HTML output to a session file
          takes_value: true
          feature_required: workspace
          suggest:
            - value: testssl-results.html
              description: Save HTML TLS findings
      arguments:
        - placeholder: <url>
          hint_only: true
          value_type: url
          description: HTTPS target URL
