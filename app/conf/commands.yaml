        - value: trufflehog filesystem --directory secrets --json
          description: Scan a session folder for exposed secrets
          feature_required: workspace
        - value: trufflehog git https://github.com/trufflesecurity/test_keys --json
          description: Scan an HTTPS Git repository for exposed secrets
          smoke:
            profile: manual
      flags:
        - value: --help
          description: Show help and usage
          closes: true
        - value: -h
          description: Show help and usage
          closes: true
        - value: --json
          description: Emit JSON rows
      subcommands:
        filesystem:
          description: Scan files in a session folder
          examples:
            - value: trufflehog filesystem --directory secrets --json
              description: Scan a session folder for exposed secrets
              feature_required: workspace
          flags:
            - value: --directory
              description: Session folder to scan
              takes_value: true
              feature_required: workspace
              suggest:
                - value: secrets
