        value: separate
        format: text
      - flag: -oN
        mode: write
        value: separate_or_attached
        format: text
      - flag: -oX
        mode: write
        value: separate_or_attached
        format: xml
      - flag: -oG
        mode: write
        value: separate_or_attached
        format: text
      - flag: -o
        mode: write
        value: separate_or_attached
        format: text
      - flag: --script-args-file
