  - root: nuclei
    description: Runs template-based checks to detect known exposures, misconfigurations, and vulnerabilities.
    category: Vulnerability Scanning
    knowledge:
      notes:
        - Templates load from /tmp/nuclei-templates (injected via -ud); pass -ud to point elsewhere.
        - Output, response-dir, export, and log flags are rewritten into the session workspace when Files are enabled.
      gotchas:
        - The progress/status bar is verbose; add -silent to keep only findings.
      safe_defaults:
        - Scope runs with -severity high,critical or -tags so the full template set does not run; use -rl to rate-limit.
      common_flags:
        - "-u — single target URL"
        - "-l — target list (session file)"
        - "-t — template or template directory"
        - "-severity — filter by severity"
        - "-silent — findings-only output"
      artifact_behavior: With Files enabled, -o/-je/-jle/-se output, -srd/-me response directories, and trace/error logs write into the session workspace; bare output paths are denied.
    help:
      flags:
        - -h
        - --help
    policy:
      allow:
        - nuclei
      deny:
        - nuclei -o
        - nuclei --output
        - nuclei -me
        - nuclei -srd
        - nuclei -store-resp-dir
        - nuclei -se
        - nuclei -sarif-export
        - nuclei -je
        - nuclei -json-export
        - nuclei -jle
        - nuclei -jsonl-export
        - nuclei -rdb
        - nuclei -report-db
        - nuclei -tlog
        - nuclei -trace-log
        - nuclei -elog
        - nuclei -error-log
        - nuclei -config
        - nuclei -rc
        - nuclei -report-config
        - nuclei -sf
        - nuclei -secret-file
        - nuclei -resume
    workspace_flags:
      - flag: -l
        mode: read
        value: separate
        format: text
      - flag: -o
        mode: write
        value: separate
        format: text
      - flag: --output
        mode: write
        value: separate_or_attached
        format: text
      - flag: -srd
        mode: write
        value: separate
        kind: directory
      - flag: -store-resp-dir
        mode: write
        value: separate
        kind: directory
      - flag: -me
        mode: write
        value: separate
        kind: directory
      - flag: -se
        mode: write
        value: separate
        format: sarif
      - flag: -sarif-export
        mode: write
        value: separate
        format: sarif
      - flag: -je
        mode: write
        value: separate
        format: json
      - flag: -json-export
        mode: write
        value: separate
        format: json
      - flag: -jle
        mode: write
        value: separate
        format: jsonl
      - flag: -jsonl-export
        mode: write
        value: separate
        format: jsonl
      - flag: -rdb
        mode: write
        value: separate
      - flag: -report-db
        mode: write
        value: separate
      - flag: -tlog
        mode: write
        value: separate
        format: text
      - flag: -trace-log
        mode: write
        value: separate
        format: text
      - flag: -elog
        mode: write
        value: separate
        format: text
      - flag: -error-log
        mode: write
        value: separate
        format: text
