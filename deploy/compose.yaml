services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --stop-writes-on-bgsave-error
      - "no"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-darklab_shell}
      POSTGRES_USER: ${POSTGRES_USER:-darklab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darklab} -d ${POSTGRES_DB:-darklab_shell}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    profiles:
      - llama
    volumes:
      - llama-cache:/root/.cache
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -hf
      - ${LLAMA_HF_MODEL:-bartowski/Meta-Llama-3.1-8B-Instruct-GGUF:Q4_K_M}
      - --alias
      - ${AI_MODEL:-Llama-3.1-8B-Instruct}
      - -t
      - "${LLAMA_THREADS:-8}"
      - -c
      - "${LLAMA_CTX_SIZE:-2048}"
      - -n
      - "${LLAMA_N_PREDICT:-180}"
      - -np
      - "${LLAMA_PARALLEL:-1}"
      - --cont-batching
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  shell:
    image: ${DARKLAB_IMAGE:-docker.io/darklabsh/darklab-shell:2.9.0}
    labels:
      sh.darklab.config.database_backend: ${DATABASE_BACKEND:-sqlite}
      sh.darklab.metrics.path: /metrics
    init: true
    ports:
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8888}:${APP_PORT:-8888}"
    volumes:
      - ./conf:/config:ro
      - ./data:/data
      # Ready for opt-in durable Files storage. Enable the volume backend and
      # select /workspaces with the adjacent WORKSPACE_* settings in .env.
      - ./workspaces:/workspaces
      - nuclei-templates:/tmp/nuclei-templates
    tmpfs:
      - /tmp
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Optional high-concurrency scanner tuning belongs in an operator-owned
    # compose.operator.yaml override; don't uncomment it in this release-owned
    # file because managed-file verification and upgrades expect it unchanged.
    # Copy the settings you need into the override's shell service, then adjust
    # them for the host's memory, workload, Docker daemon limits, and kernel.
    # These example values aren't validated across every environment, including
    # SELinux-enforcing Docker and rootless Docker or Podman, which may reject
    # some sysctls. See "Production Compose overrides" in
    # CONFIGURATION.md before enabling them.
    # ulimits:
    #   nofile:
    #     soft: 65535
    #     hard: 65535
    # sysctls:
    #   net.ipv4.ip_local_port_range: "1024 65535"
    #   net.ipv4.tcp_tw_reuse: 1
    #   net.ipv4.tcp_fin_timeout: 15
    #   net.ipv4.tcp_max_tw_buckets: 131072
    read_only: true
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_PORT: ${APP_PORT:-8888}
      APP_LOCAL_CONF_DIR: /config
      PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/tmp/darklab_shell-prom}
      DATABASE_BACKEND: ${DATABASE_BACKEND:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      # Empty environment values are ignored by the app config loader. This
      # keeps database and AI fine-tuning in conf/config.local.yaml effective
      # unless an operator deliberately exports the matching variable.
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      DATABASE_POSTGRES_JIT: ${DATABASE_POSTGRES_JIT:-}
      AI_WORKER_ENABLED: ${AI_WORKER_ENABLED:-0}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai_compatible}
      AI_BASE_URL: ${AI_BASE_URL:-http://llama:8080}
      AI_MODEL: ${AI_MODEL:-Llama-3.1-8B-Instruct}
      AI_API_KEY_SECRET_NAME: ${AI_API_KEY_SECRET_NAME:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-}
      AI_NEXT_COMMANDS_MAX_OUTPUT_TOKENS: ${AI_NEXT_COMMANDS_MAX_OUTPUT_TOKENS:-}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-}
      AI_MAX_QUEUE_DEPTH: ${AI_MAX_QUEUE_DEPTH:-}
      AI_RATE_LIMIT_PER_SESSION_HOUR: ${AI_RATE_LIMIT_PER_SESSION_HOUR:-}
      AI_RATE_LIMIT_GLOBAL_PER_MINUTE: ${AI_RATE_LIMIT_GLOBAL_PER_MINUTE:-}
      AI_ALLOW_FULL_OUTPUT: ${AI_ALLOW_FULL_OUTPUT:-}
      AI_REQUIRE_PRIVATE_BASE_URL: ${AI_REQUIRE_PRIVATE_BASE_URL:-}
      AI_BASE_URL_ALLOWED_CIDRS: ${AI_BASE_URL_ALLOWED_CIDRS:-}
      AI_PROMPT_VERSION_OVERRIDE: ${AI_PROMPT_VERSION_OVERRIDE:-}
      AI_FEATURE_SUMMARY: ${AI_FEATURE_SUMMARY:-false}
      AI_FEATURE_NEXT_COMMANDS: ${AI_FEATURE_NEXT_COMMANDS:-false}
      AI_FEATURE_RUN_SUGGESTIONS: ${AI_FEATURE_RUN_SUGGESTIONS:-false}
      WORKSPACE_ENABLED: ${WORKSPACE_ENABLED:-false}
      WORKSPACE_BACKEND: ${WORKSPACE_BACKEND:-tmpfs}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/tmp/darklab_shell-workspaces}
      INTERACTIVE_PTY_ENABLED: ${INTERACTIVE_PTY_ENABLED:-false}
      RESTRICTED_COMMAND_INPUT_CIDRS: ${RESTRICTED_COMMAND_INPUT_CIDRS:-}
      RAW_PACKET_SCANNING_ENABLED: ${RAW_PACKET_SCANNING_ENABLED:-false}
      ASSESSMENT_INTRUSIVE_ACTIONS_ENABLED: ${ASSESSMENT_INTRUSIVE_ACTIONS_ENABLED:-false}
      NUCLEI_TEMPLATE_BOOTSTRAP_ENABLED: ${NUCLEI_TEMPLATE_BOOTSTRAP_ENABLED:-true}
      NUCLEI_TEMPLATE_REFRESH_ENABLED: ${NUCLEI_TEMPLATE_REFRESH_ENABLED:-}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-}
      DARKLAB_ZAP_API_KEY: ${DARKLAB_ZAP_API_KEY:-}
      DARKLAB_ZAP_SCOPE_POLICY_TOKEN: ${DARKLAB_ZAP_SCOPE_POLICY_TOKEN:-}
      DARKLAB_OAST_TOKEN: ${DARKLAB_OAST_TOKEN:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      WEB_THREADS: ${WEB_THREADS:-4}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-1}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-1}
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${APP_PORT:-8888}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 210s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      llama:
        condition: service_healthy
        required: false

  zap-worker:
    image: ${DARKLAB_IMAGE:-docker.io/darklabsh/darklab-shell:2.9.0}
    profiles:
      - zap
    init: true
    volumes:
      - ./conf:/config:ro
      - ./data:/data
      - ./workspaces:/workspaces
    tmpfs:
      - /tmp
    read_only: true
    restart: unless-stopped
    environment:
      DARKLAB_PROCESS_ROLE: zap-worker
      REDIS_URL: redis://redis:6379/0
      APP_LOCAL_CONF_DIR: /config
      DATABASE_BACKEND: ${DATABASE_BACKEND:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      DATABASE_POSTGRES_JIT: ${DATABASE_POSTGRES_JIT:-}
      WORKSPACE_ENABLED: ${WORKSPACE_ENABLED:-false}
      WORKSPACE_BACKEND: ${WORKSPACE_BACKEND:-tmpfs}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/tmp/darklab_shell-workspaces}
      DARKLAB_ZAP_API_KEY: ${DARKLAB_ZAP_API_KEY:-}
      DARKLAB_ZAP_SCOPE_POLICY_TOKEN: ${DARKLAB_ZAP_SCOPE_POLICY_TOKEN:-}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          grep -qx 'zap-worker' /tmp/darklab-process-role.ready && kill -0 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false

  oast-worker:
    image: ${DARKLAB_IMAGE:-docker.io/darklabsh/darklab-shell:2.9.0}
    profiles:
      - oast
    init: true
    volumes:
      - ./conf:/config:ro
      - ./data:/data
      - ./workspaces:/workspaces
    tmpfs:
      - /tmp
    read_only: true
    restart: unless-stopped
    environment:
      DARKLAB_PROCESS_ROLE: oast-worker
      REDIS_URL: redis://redis:6379/0
      APP_LOCAL_CONF_DIR: /config
      DATABASE_BACKEND: ${DATABASE_BACKEND:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      DATABASE_POSTGRES_JIT: ${DATABASE_POSTGRES_JIT:-}
      WORKSPACE_ENABLED: ${WORKSPACE_ENABLED:-false}
      WORKSPACE_BACKEND: ${WORKSPACE_BACKEND:-tmpfs}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/tmp/darklab_shell-workspaces}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-}
      DARKLAB_OAST_TOKEN: ${DARKLAB_OAST_TOKEN:-}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          grep -qx 'oast-worker' /tmp/darklab-process-role.ready && kill -0 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false

volumes:
  postgres-data:
  llama-cache:
  nuclei-templates:
